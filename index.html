   en:"There are three basic families of intensity transformation functions: linear, which includes the negative and identity; logarithmic, which includes log and inverse log; and power law, also called gamma correction, with nth root and nth power curves.",
   bn:"ইনটেনসিটি ট্রান্সফরমেশন ফাংশনের তিনটি মৌলিক পরিবার আছে: লিনিয়ার, যার মধ্যে নেগেটিভ ও আইডেন্টিটি; লগারিদমিক, যার মধ্যে লগ ও ইনভার্স লগ; এবং পাওয়ার ল বা গামা কারেকশন, যার মধ্যে nth রুট ও nth পাওয়ার বক্ররেখা।"},
 {scene:"neg",k:0,en:"The image negative uses s equals L minus 1 minus r. For a 3-bit image with L equal to 8, 0 becomes 7, 1 becomes 6, and so on. Negatives enhance white or gray detail embedded in dark regions, especially when black areas are large, as in digital mammograms.",
   bn:"ইমেজ নেগেটিভে ব্যবহার হয় s সমান L বিয়োগ ১ বিয়োগ r। L সমান ৮ এমন ৩-বিট ইমেজে ০ হয় ৭, ১ হয় ৬, এভাবে চলে। নেগেটিভ অন্ধকার অঞ্চলে লুকানো সাদা বা ধূসর খুঁটিনাটি স্পষ্ট করে, বিশেষ করে যখন কালো অংশ বড়, যেমন ডিজিটাল ম্যামোগ্রামে।"}
],
points:[{en:"Families: <b>linear</b> (negative, identity), <b>logarithmic</b> (log, inverse log), <b>power law</b> (nth root, nth power).",bn:"পরিবার: <b>লিনিয়ার</b> (নেগেটিভ, আইডেন্টিটি), <b>লগারিদমিক</b> (লগ, ইনভার্স লগ), <b>পাওয়ার ল</b> (nth রুট, nth পাওয়ার)।"},{en:"Negative: <b>s = L − 1 − r</b>; reveals detail in dark regions.",bn:"নেগেটিভ: <b>s = L − ১ − r</b>; অন্ধকার অঞ্চলের খুঁটিনাটি দেখায়।"}]},
/* 5 */
{id:"log",slides:"24–30",title:{en:"Log transformation",bn:"লগ ট্রান্সফরমেশন"},
svg:`<g data-scene="lc"><g data-s="0"><g id="lg-p"></g><text class="mono lg am" x="470" y="110">s = c · log(1 + r)</text><text class="sm" x="470" y="160">dark values: stretched (expanded)</text><text class="sm" x="470" y="186">bright values: compressed</text><text class="sm dim" x="470" y="230">the slope is steep at low r and flat at high r</text></g></g>
<g data-scene="ls"><g data-s="0"><g id="lg-i"></g></g></g>
<g data-scene="lb"><g data-s="0"><g id="lg-b"></g></g></g>`,
init(svg,_){const P=plot($$(svg,"#lg-p"),{x:80,y:60,w:320,h:320,xmax:1,ymax:1,xl:"r",yl:"s",grid:1});P.fn(r=>Math.log(1+255*r)/Math.log(256),"curve");P.fn(r=>r,"curve2");
  const S=gen("spectrum",128),c=1/Math.log(1001);img2($$(svg,"#lg-i"),70,70,280,280,"Fourier spectrum, linear display").show(S,1);img2($$(svg,"#lg-i"),450,70,280,280,"after log transform").show(mapI(S,v=>c*Math.log(1+1000*v)));
  const I=mapI(SC(),v=>.45+.55*v);img2($$(svg,"#lg-b"),70,70,280,280,"details mostly in bright values").show(I);img2($$(svg,"#lg-b"),450,70,280,280,"log: bright details lost").show(mapI(I,v=>Math.log(1+255*v)/Math.log(256)))},
steps:[
 {scene:"lc",k:0,en:"The log transformation is s equals c times log of 1 plus r. It maps dark pixel values to a wider range of outputs and compresses bright values into a narrower range. So it enhances detail in dark areas and reduces contrast in bright areas, because the log rises quickly at low values and slowly at high values.",
   bn:"লগ ট্রান্সফরমেশন হলো s সমান c গুণ log(১ যোগ r)। এটি অন্ধকার পিক্সেলের মানকে বড় পরিসরে ছড়িয়ে দেয় এবং উজ্জ্বল মানকে ছোট পরিসরে চেপে আনে। ফলে অন্ধকার অংশের খুঁটিনাটি স্পষ্ট হয় এবং উজ্জ্বল অংশের কনট্রাস্ট কমে, কারণ কম মানে লগ দ্রুত বাড়ে আর বেশি মানে ধীরে বাড়ে।"},
 {scene:"ls",k:0,en:"Its main use is when the dynamic range of an image is larger than the display can show, so low values get suppressed. A Fourier spectrum is the classic example. Displayed linearly, only a bright dot is visible. After the log transform, which compresses the dynamic range, much more detail appears.",
   bn:"এর প্রধান ব্যবহার হলো যখন ইমেজের ডায়নামিক রেঞ্জ ডিসপ্লের ক্ষমতার চেয়ে বড়, ফলে কম মানগুলো চাপা পড়ে যায়। ফুরিয়ার স্পেকট্রাম এর আদর্শ উদাহরণ। সরাসরি দেখালে শুধু একটি উজ্জ্বল বিন্দু দেখা যায়। ডায়নামিক রেঞ্জ চেপে আনা লগ ট্রান্সফর্মের পরে অনেক বেশি খুঁটিনাটি দেখা যায়।"},
 {scene:"lb",k:0,en:"But the log transform enhances low values at the expense of high values. If most of the detail is in the bright values, applying it loses information, as here.",
   bn:"কিন্তু লগ ট্রান্সফর্ম কম মান উন্নত করে বেশি মানের ক্ষতির বিনিময়ে। যদি বেশিরভাগ খুঁটিনাটি উজ্জ্বল মানে থাকে, তাহলে এটি প্রয়োগ করলে তথ্য হারিয়ে যায়, যেমন এখানে।"}
],
points:[{en:"<b>s = c·log(1 + r)</b>: expands dark values, compresses bright values.",bn:"<b>s = c·log(১ + r)</b>: অন্ধকার মান ছড়ায়, উজ্জ্বল মান চাপে।"},{en:"Use: compress large dynamic range (e.g. Fourier spectrum). Avoid when detail is in high values.",bn:"ব্যবহার: বড় ডায়নামিক রেঞ্জ চাপা (যেমন ফুরিয়ার স্পেকট্রাম)। উজ্জ্বল মানে খুঁটিনাটি থাকলে এড়িয়ে চলো।"}]},
/* 6 */
{id:"gamma",slides:"31–39",title:{en:"Power law (gamma) transformation",bn:"পাওয়ার ল (গামা) ট্রান্সফরমেশন"},
svg:`<g id="gm-p"></g><g id="gm-i"></g><text class="mono lg am" x="440" y="60">s = c · r^γ</text><text class="mono sm" x="440" y="88">c = (2ᵏ − 1) / (2ᵏ − 1)^γ</text><text id="gm-t" class="mono lg" x="440" y="410"></text>`,
init(svg,_){const P=plot($$(svg,"#gm-p"),{x:70,y:60,w:320,h:320,xmax:1,ymax:1,xl:"r",yl:"s",grid:1});_.P=P;[.04,.1,.2,.4,.67,1,1.5,2.5,5,10,25].forEach(g=>{const p=P.fn(curveGamma(g),"gl");p.style.stroke="#3A5578";p.style.strokeWidth=1.5});
  _.c=P.fn(r=>r,"curve");_.im=img2($$(svg,"#gm-i"),480,110,260,260)},
steps:[
 {k:0,fx:(svg,_)=>{const I=SC();return rafLoop(t=>{const g=Math.pow(10,Math.sin(t*.6)*.85);_.P.upd(_.c,curveGamma(g));_.im.show(mapI(I,curveGamma(g)));$$(svg,"#gm-t").textContent=`γ = ${g.toFixed(2)}`})},
   en:"The power law transformation is s equals c times r to the power gamma. For a k-bit image, c is 2 to the k minus 1, divided by 2 to the k minus 1 raised to gamma, so that the output stays in range. Watch the curve as gamma changes.",
   bn:"পাওয়ার ল ট্রান্সফরমেশন হলো s সমান c গুণ r-এর গামা ঘাত। k-বিট ইমেজের জন্য c হলো ২-এর k ঘাত বিয়োগ ১ ভাগ (২-এর k ঘাত বিয়োগ ১)-এর গামা ঘাত, যাতে আউটপুট পরিসরের মধ্যে থাকে। গামা বদলালে বক্ররেখা কীভাবে বদলায় দেখো।"},
 {k:0,fx:(svg,_)=>{_.P.upd(_.c,curveGamma(.4));_.im.show(mapI(SC(),curveGamma(.4)));$$(svg,"#gm-t").textContent="γ = 0.4 < 1"},
   en:"When gamma is less than 1, dark pixels are brightened more than bright pixels. The image looks brighter overall, and detail in dark regions becomes visible.",
   bn:"গামা ১-এর কম হলে অন্ধকার পিক্সেল উজ্জ্বল পিক্সেলের চেয়ে বেশি উজ্জ্বল হয়। পুরো ইমেজ উজ্জ্বল দেখায়, আর অন্ধকার অংশের খুঁটিনাটি দৃশ্যমান হয়।"},
 {k:0,fx:(svg,_)=>{_.P.upd(_.c,curveGamma(2.5));_.im.show(mapI(SC(),curveGamma(2.5)));$$(svg,"#gm-t").textContent="γ = 2.5 > 1"},
   en:"When gamma is greater than 1, dark regions get even darker and bright regions become less bright. The image looks darker overall. Remember, the real objective of gamma correction is a faithful display of the input image, even though a different gamma sometimes looks better to viewers.",
   bn:"গামা ১-এর বেশি হলে অন্ধকার অংশ আরও গাঢ় হয় আর উজ্জ্বল অংশ কম উজ্জ্বল হয়। পুরো ইমেজ গাঢ় দেখায়। মনে রেখো, গামা কারেকশনের আসল উদ্দেশ্য হলো ইনপুট ইমেজের বিশ্বস্ত প্রদর্শন, যদিও অন্য গামা কখনো কখনো দর্শকের কাছে বেশি ভালো লাগে।"}
],
panel:()=>`<h3>${tr({en:"Try it: gamma",bn:"নিজে করো: গামা"})}</h3><div class="prow">${sl("gg","γ",-1.4,1.4,.01,0)}</div><img id="gim" alt="" width="256" height="256" style="border-radius:6px;max-width:100%">`,
bind(root){const I=SC();const f=()=>{const g=Math.pow(10,+root.querySelector("#gg").value);root.querySelector("#ggo").textContent=g.toFixed(2);root.querySelector("#gim").src=toURL(mapI(I,curveGamma(g)))};root.querySelector("#gg").oninput=f;f()},
points:[{en:"<b>s = c·r^γ</b>, c = (2ᵏ−1)/(2ᵏ−1)^γ.",bn:"<b>s = c·r^γ</b>, c = (২ᵏ−১)/(২ᵏ−১)^γ।"},{en:"γ &lt; 1: brighter, dark detail revealed. γ &gt; 1: darker. Goal: faithful display.",bn:"γ &lt; ১: উজ্জ্বল, অন্ধকারের খুঁটিনাটি দৃশ্যমান। γ &gt; ১: গাঢ়। উদ্দেশ্য: বিশ্বস্ত প্রদর্শন।"}]},
/* 7 */
{id:"stretch",slides:"40–45",title:{en:"Piecewise linear: contrast stretching",bn:"পিসওয়াইজ লিনিয়ার: কনট্রাস্ট স্ট্রেচিং"},
svg:`<g id="cs-p"></g><g id="cs-i"></g><text id="cs-t" class="sm am" x="440" y="410"></text>`,
init(svg,_){const P=plot($$(svg,"#cs-p"),{x:70,y:60,w:300,h:300,xmax:1,ymax:1,xl:"r",yl:"s",grid:1});_.P=P;_.c=P.fn(r=>r,"curve");_.d1=el(P.g,"circle",{r:6,style:"fill:#4CC489"});_.d2=el(P.g,"circle",{r:6,style:"fill:#4CC489"});
  _.l1=txt(P.g,0,0,"(r₁, s₁)","sm gn");_.l2=txt(P.g,0,0,"(r₂, s₂)","sm gn");_.a=img2($$(svg,"#cs-i"),430,60,165,165,"low contrast");_.b=img2($$(svg,"#cs-i"),610,60,165,165,"stretched");_.a.show(LOW());
  _.set=(r1,s1,r2,s2)=>{const T=r=>r<=r1?(r1?s1*r/r1:0):r>=r2?(r2<1?s2+(1-s2)*(r-r2)/(1-r2):1):s1+(s2-s1)*(r-r1)/Math.max(1e-6,r2-r1);P.upd(_.c,T,300);
    _.d1.setAttribute("cx",P.X(r1));_.d1.setAttribute("cy",P.Y(s1));_.d2.setAttribute("cx",P.X(r2));_.d2.setAttribute("cy",P.Y(s2));_.l1.setAttribute("x",P.X(r1)+8);_.l1.setAttribute("y",P.Y(s1)-8);_.l2.setAttribute("x",P.X(r2)+8);_.l2.setAttribute("y",P.Y(s2)+18);
    _.b.show(mapI(LOW(),T));$$(svg,"#cs-t").textContent=`(r₁,s₁) = (${Math.round(r1*255)}, ${Math.round(s1*255)})   (r₂,s₂) = (${Math.round(r2*255)}, ${Math.round(s2*255)})`}},
steps:[
 {k:0,fx:(svg,_)=>_.set(.33,.33,.66,.66),en:"Low contrast images come from poor illumination, a limited dynamic range in the sensor, or a wrong lens aperture setting. Contrast stretching expands the range of intensities so that it fills the full dynamic range. It is controlled by two points, r1 s1 and r2 s2. If r1 equals s1 and r2 equals s2, the function is the identity and nothing changes.",
   bn:"কম কনট্রাস্টের ইমেজ আসে দুর্বল আলো, সেন্সরের সীমিত ডায়নামিক রেঞ্জ বা লেন্সের ভুল অ্যাপারচারের কারণে। কনট্রাস্ট স্ট্রেচিং তীব্রতার পরিসর বাড়িয়ে পুরো ডায়নামিক রেঞ্জ ভরিয়ে দেয়। এটি দুটি বিন্দু, r1 s1 ও r2 s2 দিয়ে নিয়ন্ত্রিত হয়। r1 সমান s1 ও r2 সমান s2 হলে ফাংশনটি আইডেন্টিটি, কিছুই বদলায় না।"},
 {k:0,fx:(svg,_)=>_.set(.36,0,.64,1),en:"With r1 s1 at r min, 0, and r2 s2 at r max, L minus 1, the levels are stretched linearly from their original range to the full range, 0 to L minus 1. This is min-max contrast stretching.",
   bn:"r1 s1 = (r min, ০) এবং r2 s2 = (r max, L বিয়োগ ১) নিলে লেভেলগুলো তাদের মূল পরিসর থেকে পুরো পরিসর ০ থেকে L বিয়োগ ১ পর্যন্ত সরলরৈখিকভাবে ছড়িয়ে যায়। একে বলে মিন-ম্যাক্স কনট্রাস্ট স্ট্রেচিং।"},
 {k:0,fx:(svg,_)=>_.set(.41,0,.59,1),en:"Percentile stretching moves the points inward by a constant C: r min plus C, and r max minus C. A few extreme pixels are clipped, and the rest get more contrast.",
   bn:"পার্সেন্টাইল স্ট্রেচিংয়ে বিন্দুগুলো একটি ধ্রুবক C পরিমাণ ভেতরে সরানো হয়: r min যোগ C, এবং r max বিয়োগ C। কয়েকটি চরম পিক্সেল কেটে যায়, আর বাকিগুলো বেশি কনট্রাস্ট পায়।"},
 {k:0,fx:(svg,_)=>_.set(.5,0,.5,1),en:"If r1 equals r2, s1 is 0 and s2 is L minus 1, the function becomes a thresholding function, and the result is a binary image.",
   bn:"r1 সমান r2, s1 সমান ০ এবং s2 সমান L বিয়োগ ১ হলে ফাংশনটি থ্রেশহোল্ডিং ফাংশন হয়ে যায়, আর ফলাফল হয় একটি বাইনারি ইমেজ।"}
],
panel:()=>`<h3>${tr({en:"Try it: move the control points",bn:"নিজে করো: কন্ট্রোল পয়েন্ট সরাও"})}</h3><div class="prow">${sl("r1","r₁",0,255,1,92)}${sl("r2","r₂",0,255,1,163)}</div><p class="fine">${tr({en:"s₁ = 0 and s₂ = 255. The stage above updates.",bn:"s₁ = ০ এবং s₂ = ২৫৫। উপরের স্টেজ বদলাবে।"})}</p>`,
bind(root,svg,_){const f=()=>{let a=+root.querySelector("#r1").value,b=+root.querySelector("#r2").value;if(b<a)[a,b]=[b,a];root.querySelector("#r1o").textContent=a;root.querySelector("#r2o").textContent=b;_.set(a/255,0,b/255,1)};root.querySelectorAll("input").forEach(e=>e.oninput=f)},
points:[{en:"Causes of low contrast: poor illumination, limited sensor dynamic range, wrong aperture.",bn:"কম কনট্রাস্টের কারণ: দুর্বল আলো, সেন্সরের সীমিত ডায়নামিক রেঞ্জ, ভুল অ্যাপারচার।"},{en:"Min-max: (r_min, 0), (r_max, L−1). Percentile: (r_min + C, 0), (r_max − C, L−1). r₁ = r₂ → thresholding.",bn:"মিন-ম্যাক্স: (r_min, ০), (r_max, L−১)। পার্সেন্টাইল: (r_min + C, ০), (r_max − C, L−১)। r₁ = r₂ → থ্রেশহোল্ডিং।"}]},
/* 8 */
{id:"slicing",slides:"46–49",title:{en:"Intensity level slicing",bn:"ইনটেনসিটি লেভেল স্লাইসিং"},
svg:`<g id="sc-p1"></g><g id="sc-p2"></g><g id="sc-i"></g>`,
init(svg,_){const A=.7,B=.92;_.A=A;_.B=B;const P1=plot($$(svg,"#sc-p1"),{x:50,y:40,w:150,h:150,xmax:1,ymax:1,xl:"r",yl:"s"});P1.fn(r=>r>=A&&r<=B?1:.08,"curve",300);txt(P1.g,125,232,"(a) binary result","c dim xs");
  const P2=plot($$(svg,"#sc-p2"),{x:50,y:260,w:150,h:150,xmax:1,ymax:1,xl:"r",yl:"s"});P2.fn(r=>r>=A&&r<=B?1:r,"curve",300);txt(P2.g,125,432,"(b) others unchanged","c dim xs");
  _.o=img2($$(svg,"#sc-i"),250,60,160,160,"angiogram");_.a=img2($$(svg,"#sc-i"),430,60,160,160,"(a) range → white");_.b=img2($$(svg,"#sc-i"),610,60,160,160,"(b) range → white, rest kept");
  const I=gen("angio",128);_.o.show(I);_.a.show(mapI(I,v=>v>=A&&v<=B?1:0));_.b.show(mapI(I,v=>v>=A&&v<=B?1:v));
  _.c=img2($$(svg,"#sc-i"),430,270,160,140,"mid-gray band set to black");_.c.show(mapI(I,v=>v>=.33&&v<=.48?0:v));_.c.g.style.opacity=0},
steps:[
 {k:0,fx:(svg,_)=>{_.c.g.style.opacity=0},en:"Intensity level slicing highlights a particular range of intensities that is of interest. It is used in medical images, for example to enhance flaws in X-rays, and in satellite images to highlight water bodies.",
   bn:"ইনটেনসিটি লেভেল স্লাইসিং আগ্রহের একটি নির্দিষ্ট তীব্রতার পরিসরকে স্পষ্ট করে। এটি মেডিক্যাল ইমেজে ব্যবহৃত হয়, যেমন এক্স-রের ত্রুটি স্পষ্ট করতে, আর স্যাটেলাইট ইমেজে জলাশয় চিহ্নিত করতে।"},
 {k:0,fx:(svg,_)=>{_.c.g.style.opacity=0},en:"There are two basic approaches. In the first, every value in the range of interest, A to B, becomes white and everything else becomes black, producing a binary image. In an aortic angiogram this shows the blood vessels and parts of the kidneys in white, useful for studying the shape of the contrast flow, for example to detect blockages.",
   bn:"দুটি মৌলিক পদ্ধতি আছে। প্রথমটিতে আগ্রহের পরিসর A থেকে B-এর সব মান সাদা আর বাকি সব কালো হয়, ফলে একটি বাইনারি ইমেজ তৈরি হয়। অ্যাওর্টিক অ্যানজিওগ্রামে এতে রক্তনালি ও কিডনির অংশ সাদা দেখায়, যা কনট্রাস্টের প্রবাহের আকৃতি দেখতে কাজে লাগে, যেমন ব্লকেজ খুঁজতে।"},
 {k:0,fx:(svg,_)=>{_.c.g.style.opacity=1},en:"In the second approach, the chosen range is brightened or darkened, and all other levels stay unchanged. Setting a mid-gray band to black, while keeping the rest, preserves the gray tones of the vessels and kidneys. This helps when measuring the actual flow of the contrast medium over time.",
   bn:"দ্বিতীয় পদ্ধতিতে নির্বাচিত পরিসর উজ্জ্বল বা গাঢ় করা হয়, আর বাকি সব লেভেল অপরিবর্তিত থাকে। মাঝারি ধূসর একটি ব্যান্ডকে কালো করে বাকিটা রেখে দিলে রক্তনালি ও কিডনির ধূসর টোন অক্ষত থাকে। সময়ের সাথে কনট্রাস্ট মিডিয়ামের প্রকৃত প্রবাহ মাপতে এটি কাজে লাগে।"}
],
points:[{en:"(a) Range [A, B] → one value (white), others → another (black): binary.",bn:"(ক) পরিসর [A, B] → একটি মান (সাদা), বাকি → অন্য মান (কালো): বাইনারি।"},{en:"(b) Brighten or darken [A, B], leave other levels unchanged.",bn:"(খ) [A, B] উজ্জ্বল বা গাঢ় করো, বাকি লেভেল অপরিবর্তিত।"}]},
/* 9 */
{id:"bitplane",slides:"50–58",title:{en:"Bit-plane slicing",bn:"বিট-প্লেন স্লাইসিং"},
svg:`<g data-scene="bin"><g data-s="0"><g id="bp-m"></g><g id="bp-b"></g><text id="bp-t" class="mono am" x="40" y="400"></text></g></g>
<g data-scene="pl"><g data-s="0"><g id="bp-i"></g></g></g>`,
init(svg,_){const V=[[167,133,111],[144,140,135],[159,154,148]];_.V=V;_.M=mat($$(svg,"#bp-m"),{x:60,y:110,cs:70,data:V,fs:18,label:"8-bit pixels"});
  _.B=mat($$(svg,"#bp-b"),{x:340,y:110,cs:46,fs:16,data:[0,1,2].map(()=>Array(8).fill(0)),label:"bits 8 7 6 5 4 3 2 1"});
  const I=SC(),g=$$(svg,"#bp-i");_.P=[];for(let b=8;b>=1;b--){const k=8-b;const q=imgEl(g,30+(k%4)*190,30+Math.floor(k/4)*200,160,160,`bit plane ${b}`);q.show(mapI(I,v=>(Math.round(v*255)>>(b-1))&1));_.P.push(q)}},
steps:[
 {scene:"bin",k:0,fx:(svg,_)=>{let i=0;return every(1300,()=>{const r=Math.floor(i/3)%3,c=i%3;_.M.clear("a");_.M.cls(r,c,"a");const s=_.V[r][c].toString(2).padStart(8,"0");s.split("").forEach((b,j)=>{_.B.set(r,j,b);_.B.cls(r,j,"w",b==="1")});$$(svg,"#bp-t").textContent=`${_.V[r][c]} = ${s}`;i++})},
   en:"An 8-bit pixel is made of 8 bits. Bit-plane slicing separates the image into 8 binary images, one for each bit. For example, 167 is 1 0 1 0 0 1 1 1 in binary. It is used in image reconstruction, compression and encryption.",
   bn:"একটি ৮-বিট পিক্সেল ৮টি বিট দিয়ে তৈরি। বিট-প্লেন স্লাইসিং ইমেজকে ৮টি বাইনারি ইমেজে ভাগ করে, প্রতিটি বিটের জন্য একটি। যেমন ১৬৭-এর বাইনারি হলো ১ ০ ১ ০ ০ ১ ১ ১। এটি ইমেজ পুনর্গঠন, কমপ্রেশন ও এনক্রিপশনে ব্যবহৃত হয়।"},
 {scene:"pl",k:0,fx:(svg,_)=>{let i=0;_.P.forEach(q=>q.g.style.opacity=.15);return every(700,()=>{_.P.forEach((q,j)=>q.g.style.opacity=j<=i?1:.15);i=Math.min(7,i+1)})},
   en:"Bit plane 8 holds the most significant bit, and bit plane 1 the least significant. The higher planes 6, 7 and 8 carry most of the visual information. The lower planes 1 to 5 carry fine detail and look like noise.",
   bn:"বিট প্লেন ৮-এ থাকে সবচেয়ে গুরুত্বপূর্ণ বিট, আর বিট প্লেন ১-এ সবচেয়ে কম গুরুত্বপূর্ণ বিট। উপরের প্লেন ৬, ৭ ও ৮ বেশিরভাগ দৃশ্যমান তথ্য বহন করে। নিচের প্লেন ১ থেকে ৫ সূক্ষ্ম খুঁটিনাটি বহন করে এবং নয়েজের মতো দেখায়।"}
],
points:[{en:"8-bit image → 8 binary bit planes; e.g. 167 = 10100111.",bn:"৮-বিট ইমেজ → ৮টি বাইনারি বিট প্লেন; যেমন ১৬৭ = ১০১০০১১১।"},{en:"Planes 6–8: most significant information. Planes 1–5: least significant.",bn:"প্লেন ৬–৮: সবচেয়ে গুরুত্বপূর্ণ তথ্য। প্লেন ১–৫: কম গুরুত্বপূর্ণ।"}]},
/* 10 */
{id:"histogram",slides:"59–62",title:{en:"Histograms",bn:"হিস্টোগ্রাম"},
svg:`<text class="mono am" x="40" y="44">h(r_k) = n_k      p(r_k) = n_k / MN</text><g id="hs-g"></g>`,
init(svg,_){const I=SC();const V=[["dark",mapI(I,v=>v*.4)],["light",mapI(I,v=>.6+v*.4)],["low contrast",mapI(I,v=>.4+v*.2)],["high contrast",I]];const g=$$(svg,"#hs-g");
  _.Q=V.map(([n,im],i)=>{const q=el(g,"g");const a=img2(q,30+i*190,70,170,170,"");a.show(im);const b=bars(q,{x:30+i*190,y:270,w:170,h:120,n:32,cls:"hbar"});const h=histo(im,32);b.set(h);txt(q,115+i*190,420,n,"c sm");return q})},
steps:[
 {k:0,en:"A histogram is the frequency of occurrence of each gray level in an image. For levels from 0 to L minus 1, h of r k equals n k, the number of pixels with level r k. Dividing by the total number of pixels, M times N, gives the normalised histogram, p of r k, an estimate of the probability of each level. Histograms are used in enhancement, compression and segmentation.",
   bn:"হিস্টোগ্রাম হলো ইমেজে প্রতিটি গ্রে লেভেল কতবার আছে তার হিসাব। ০ থেকে L বিয়োগ ১ লেভেলের জন্য h(r k) সমান n k, অর্থাৎ r k লেভেলের পিক্সেলের সংখ্যা। মোট পিক্সেল M গুণ N দিয়ে ভাগ করলে পাওয়া যায় নর্মালাইজড হিস্টোগ্রাম p(r k), যা প্রতিটি লেভেলের সম্ভাবনার অনুমান। হিস্টোগ্রাম এনহ্যান্সমেন্ট, কমপ্রেশন ও সেগমেন্টেশনে ব্যবহৃত হয়।"},
 {k:0,fx:(svg,_)=>{let i=0;return every(1300,()=>{_.Q.forEach((q,j)=>q.style.opacity=j===i%4?1:.3);i++})},
   en:"The shape of the histogram tells us about the image. A dark image has bars crowded at the low end. A light image has them at the high end. A low contrast image has a narrow histogram in the middle. A high contrast image spreads across the whole range.",
   bn:"হিস্টোগ্রামের আকার ইমেজ সম্পর্কে বলে দেয়। অন্ধকার ইমেজে বারগুলো নিচের প্রান্তে জমা থাকে। উজ্জ্বল ইমেজে থাকে উপরের প্রান্তে। কম কনট্রাস্টের ইমেজে মাঝখানে একটি সরু হিস্টোগ্রাম থাকে। বেশি কনট্রাস্টের ইমেজে বারগুলো পুরো পরিসর জুড়ে ছড়ানো থাকে।"}
],
points:[{en:"<b>h(r_k) = n_k</b>; normalised <b>p(r_k) = n_k / MN</b>.",bn:"<b>h(r_k) = n_k</b>; নর্মালাইজড <b>p(r_k) = n_k / MN</b>।"},{en:"Dark, light, low contrast and high contrast images have characteristic histograms.",bn:"অন্ধকার, উজ্জ্বল, কম ও বেশি কনট্রাস্টের ইমেজের নিজস্ব হিস্টোগ্রাম আকার আছে।"}]},
/* 11 */
{id:"histeq",slides:"63–81",title:{en:"Histogram equalization",bn:"হিস্টোগ্রাম ইকুয়ালাইজেশন"},
svg:`<g data-scene="eq"><g data-s="0"><text class="mono am" x="40" y="44">s_k = T(r_k) = (L − 1) Σⱼ₌₀ᵏ p_r(r_j)</text><g id="he-t"></g><g id="he-h1"></g><g id="he-h2"></g></g></g>
<g data-scene="im"><g data-s="0"><g id="he-i"></g></g></g>`,
init(svg,_){const n=[790,1023,850,656,329,245,122,81];const T=histEqTable(n,8,1);_.T=T;
  _.tb=table($$(svg,"#he-t"),{x:40,y:70,cw:[42,66,62,72,62],rh:34,fs:12,head:["r","n","p","(L−1)·cdf","s"],rows:T.map(t=>[t.k,t.n,t.p.toFixed(2),t.s.toFixed(2),t.r])});
  for(let r=0;r<8;r++)for(let c=2;c<5;c++)_.tb.cells[r][c].t.style.opacity=0;
  _.h1=bars($$(svg,"#he-h1"),{x:400,y:70,w:360,h:130,n:8,labels:[0,1,2,3,4,5,6,7],title:"original histogram (64 × 64, 3-bit)",values:1});_.h1.set(n,1100);
  _.h2=bars($$(svg,"#he-h2"),{x:400,y:270,w:360,h:130,n:8,labels:[0,1,2,3,4,5,6,7],title:"equalized histogram",cls:"hbar2",values:1});
  const I=LOW();img2($$(svg,"#he-i"),40,70,200,200,"low contrast").show(I);img2($$(svg,"#he-i"),300,70,200,200,"equalized").show(equalize(I));
  const b1=bars($$(svg,"#he-i"),{x:40,y:310,w:200,h:90,n:32});b1.set(histo(I,32));const b2=bars($$(svg,"#he-i"),{x:300,y:310,w:200,h:90,n:32,cls:"hbar2"});b2.set(histo(equalize(I),32));
  txt($$(svg,"#he-i"),640,140,"histogram spread over","c sm");txt($$(svg,"#he-i"),640,164,"the full range [0, L − 1]","c sm");txt($$(svg,"#he-i"),640,210,"fully automatic:","c dim sm");txt($$(svg,"#he-i"),640,234,"no parameters to choose","c dim sm")},
steps:[
 {scene:"eq",k:0,fx:(svg,_)=>{for(let r=0;r<8;r++)for(let c=2;c<5;c++)_.tb.cells[r][c].t.style.opacity=0;_.h2.set([0,0,0,0,0,0,0,0],1100);_.tb.clear()},
   en:"A good, high contrast image tends to have a flat, uniform histogram over the whole range. Histogram equalization aims for that. The transformation is the cumulative distribution: s k equals L minus 1 times the sum of p of r j, for j from 0 to k. Let's work the example: a 3-bit, 64 by 64 image, so 4096 pixels.",
   bn:"ভালো, বেশি কনট্রাস্টের ইমেজের হিস্টোগ্রাম সাধারণত পুরো পরিসর জুড়ে সমতল বা সুষম হয়। হিস্টোগ্রাম ইকুয়ালাইজেশন সেটাই চায়। ট্রান্সফরমেশনটি হলো ক্রমযোজিত বণ্টন: s k সমান L বিয়োগ ১ গুণ j = ০ থেকে k পর্যন্ত p(r j)-এর যোগফল। চলো উদাহরণটি করি: একটি ৩-বিট, ৬৪ বাই ৬৪ ইমেজ, অর্থাৎ ৪০৯৬ পিক্সেল।"},
 {scene:"eq",k:0,fx:(svg,_)=>{const L=[];for(let r=0;r<8;r++)L.push([900,()=>{_.tb.clear();_.tb.hl(r);for(let c=2;c<5;c++)_.tb.cells[r][c].t.style.opacity=1}]);
   L.reset=()=>{for(let r=0;r<8;r++)for(let c=2;c<5;c++)_.tb.cells[r][c].t.style.opacity=0;_.tb.clear()};return seq(L,true,2500)},
   en:"For each level, divide the count by 4096 to get p. Add up p cumulatively and multiply by L minus 1, which is 7. For level 0: 790 over 4096 is 0.19, times 7 is 1.33, which rounds to 1. For level 1, the running total gives 3.08, which rounds to 3. Continue down to level 7, which reaches 7.",
   bn:"প্রতিটি লেভেলের জন্য সংখ্যাকে ৪০৯৬ দিয়ে ভাগ করে p পাও। p-গুলো ক্রমে যোগ করে L বিয়োগ ১, অর্থাৎ ৭ দিয়ে গুণ করো। লেভেল ০-এর জন্য: ৭৯০ ভাগ ৪০৯৬ হলো ০.১৯, গুণ ৭ হলো ১.৩৩, রাউন্ড করে ১। লেভেল ১-এর জন্য ক্রমযোগফল দেয় ৩.০৮, রাউন্ড করে ৩। এভাবে লেভেল ৭ পর্যন্ত, যা ৭-এ পৌঁছায়।"},
 {scene:"eq",k:0,fx:(svg,_)=>{for(let r=0;r<8;r++)for(let c=2;c<5;c++)_.tb.cells[r][c].t.style.opacity=1;_.tb.clear();const o=[0,0,0,0,0,0,0,0];_.T.forEach(t=>o[t.r]+=t.n);_.h2.set(o,1100)},
   en:"Now move each pixel count to its new level. Levels 3 and 4 both map to 6, so 656 plus 329 gives 985. Levels 5, 6 and 7 all map to 7, giving 448. The result is spread more evenly across the range. In discrete images the histogram is not perfectly flat, but it covers a wider range.",
   bn:"এবার প্রতিটি লেভেলের পিক্সেল সংখ্যা তার নতুন লেভেলে সরাও। লেভেল ৩ ও ৪ দুটোই ৬-এ যায়, তাই ৬৫৬ যোগ ৩২৯ হয় ৯৮৫। লেভেল ৫, ৬ ও ৭ সবই ৭-এ যায়, তাতে হয় ৪৪৮। ফলাফল পুরো পরিসর জুড়ে বেশি সমানভাবে ছড়ানো। বিচ্ছিন্ন ইমেজে হিস্টোগ্রাম পুরোপুরি সমতল হয় না, তবে আরও বড় পরিসর জুড়ে থাকে।"},
 {scene:"im",k:0,en:"On a real image, equalization automatically spreads the histogram across the full range and greatly increases contrast. It needs no parameters, which makes it very convenient.",
   bn:"বাস্তব ইমেজে ইকুয়ালাইজেশন স্বয়ংক্রিয়ভাবে হিস্টোগ্রামকে পুরো পরিসরে ছড়িয়ে দেয় এবং কনট্রাস্ট অনেক বাড়িয়ে দেয়। এতে কোনো প্যারামিটার লাগে না, তাই এটি খুব সুবিধাজনক।"}
],
points:[{en:"<b>s_k = (L − 1) Σ p_r(r_j)</b>, j = 0…k (the CDF).",bn:"<b>s_k = (L − ১) Σ p_r(r_j)</b>, j = ০…k (CDF)।"},{en:"Example (L = 8, 4096 px): r → s = 1, 3, 5, 6, 6, 7, 7, 7; new counts at 1, 3, 5, 6, 7 = 790, 1023, 850, 985, 448.",bn:"উদাহরণ (L = ৮, ৪০৯৬ পিক্সেল): r → s = ১, ৩, ৫, ৬, ৬, ৭, ৭, ৭; নতুন সংখ্যা ১, ৩, ৫, ৬, ৭-এ = ৭৯০, ১০২৩, ৮৫০, ৯৮৫, ৪৪৮।"}]},
/* 12 */
{id:"histeq2",slides:"82–86",title:{en:"Histogram equalization: a 5 × 5 example",bn:"হিস্টোগ্রাম ইকুয়ালাইজেশন: ৫ × ৫ উদাহরণ"},
svg:`<g id="h2-a"></g><g id="h2-t"></g><g id="h2-b"></g><text id="h2-f" class="mono am c" x="400" y="420"></text>`,
init(svg,_){const A=[[1,2,1,1,1],[2,5,3,5,2],[2,5,5,5,2],[2,5,3,5,2],[1,5,1,2,1]];_.A=A;const n=new Array(8).fill(0);A.flat().forEach(v=>n[v]++);const T=histEqTable(n,8);_.map=T.map(t=>t.r);
  _.M=mat($$(svg,"#h2-a"),{x:30,y:90,cs:48,data:A,label:"input (L = 8)"});
  _.tb=table($$(svg,"#h2-t"),{x:300,y:60,cw:[34,40,56,50],rh:32,fs:12,head:["r","n","7·cdf","s"],rows:T.map(t=>[t.k,t.n,t.s.toFixed(2),t.r])});
  _.O=mat($$(svg,"#h2-b"),{x:530,y:90,cs:48,data:A.map(r=>r.map(()=>"")),label:"output"})},
steps:[
 {k:0,fx:(svg,_)=>{_.tb.clear();[1,2,3,5].forEach(r=>_.tb.hl(r));$$(svg,"#h2-f").textContent="25 pixels · counts: 1 → 7, 2 → 8, 3 → 2, 5 → 8"},
   en:"Here is a 5 by 5 image with maximum value 5, so we use 8 levels and L minus 1 equals 7. Counting the pixels: seven 1s, eight 2s, two 3s and eight 5s. The table gives 7 times the cumulative probability, rounded: 1 maps to 2, 2 maps to 4, 3 maps to 5, and 5 maps to 7.",
   bn:"এখানে একটি ৫ বাই ৫ ইমেজ, যার সর্বোচ্চ মান ৫, তাই আমরা ৮টি লেভেল নিই এবং L বিয়োগ ১ সমান ৭। পিক্সেল গুনলে: সাতটি ১, আটটি ২, দুটি ৩ এবং আটটি ৫। টেবিলে ৭ গুণ ক্রমযোজিত সম্ভাবনা রাউন্ড করে পাওয়া যায়: ১ যায় ২-এ, ২ যায় ৪-এ, ৩ যায় ৫-এ, আর ৫ যায় ৭-এ।"},
 {k:0,fx:(svg,_)=>{const L=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++)L.push([280,()=>{_.M.clear("a");_.M.cls(r,c,"a");const v=_.A[r][c],o=_.map[v];_.O.set(r,c,o);_.O.gray(r,c,o/7);$$(svg,"#h2-f").textContent=`${v} → ${o}`}]);
   L.reset=()=>{for(let r=0;r<5;r++)for(let c=0;c<5;c++){_.O.set(r,c,"");_.O.cells[r][c].rect.style.fill=""}};return seq(L,true,2500)},
   en:"Now replace every pixel using the mapping. The output uses the wider range from 2 to 7, so the image has more contrast.",
   bn:"এবার ম্যাপিং ব্যবহার করে প্রতিটি পিক্সেল বদলাও। আউটপুট ২ থেকে ৭ পর্যন্ত বড় পরিসর ব্যবহার করে, তাই ইমেজের কনট্রাস্ট বেড়ে যায়।"}
],
points:[{en:"Counts: 1 → 7, 2 → 8, 3 → 2, 5 → 8 (25 pixels). Mapping: 1→2, 2→4, 3→5, 5→7.",bn:"সংখ্যা: ১ → ৭, ২ → ৮, ৩ → ২, ৫ → ৮ (২৫ পিক্সেল)। ম্যাপিং: ১→২, ২→৪, ৩→৫, ৫→৭।"}]},

{id:"histmatch",slides:"87–112",title:{en:"Histogram matching (specification)",bn:"হিস্টোগ্রাম ম্যাচিং (স্পেসিফিকেশন)"},
svg:`<g data-scene="st"><g data-s="0"><text class="h" x="40" y="50">THREE STEPS</text>
  <rect class="boxa" x="40" y="90" width="230" height="100" rx="10"/><text class="c" x="155" y="132">1 · equalize the input</text><text class="c mono am" x="155" y="160">s = T(r)</text>
  <rect class="boxb" x="285" y="90" width="230" height="100" rx="10"/><text class="c" x="400" y="132">2 · equalize the target</text><text class="c mono bl" x="400" y="160">G(z)</text>
  <rect class="box" x="530" y="90" width="230" height="100" rx="10"/><text class="c" x="645" y="132">3 · relate the two</text><text class="c mono" x="645" y="160">z = G⁻¹(s)</text>
  <text class="sm dim" x="40" y="250">Equalization always aims for a flat histogram. Matching produces an output whose</text><text class="sm dim" x="40" y="274">histogram follows a specified (target) histogram instead.</text></g></g>
<g data-scene="ex"><g data-s="0"><g id="hm-t"></g><g id="hm-h"></g><text id="hm-f" class="mono am" x="40" y="420"></text></g></g>`,
init(svg,_){const n=[8,10,10,2,12,16,4,2],t=[0,0,0,0,20,20,16,8];const Ts=histEqTable(n,8).map(x=>x.r),G=histEqTable(t,8).map(x=>x.r);
  const Z=Ts.map(s=>{for(let z=0;z<8;z++)if(G[z]>=s)return z;return 7});_.Z=Z;
  _.tb=table($$(svg,"#hm-t"),{x:30,y:40,cw:[40,48,48,48,48,48],rh:36,fs:13,head:["r","n","s","z","G(z)","r→z"],rows:n.map((v,k)=>[k,v,Ts[k],k,G[k],""])});
  _.h1=bars($$(svg,"#hm-h"),{x:400,y:50,w:170,h:120,n:8,labels:[0,1,2,3,4,5,6,7],title:"original",values:1});_.h1.set(n,30);
  _.h2=bars($$(svg,"#hm-h"),{x:600,y:50,w:170,h:120,n:8,labels:[0,1,2,3,4,5,6,7],title:"target",cls:"hbar2",values:1});_.h2.set(t,30);
  _.h3=bars($$(svg,"#hm-h"),{x:480,y:250,w:220,h:130,n:8,labels:[0,1,2,3,4,5,6,7],title:"output (matched)",cls:"hbar2",values:1})},
steps:[
 {scene:"st",k:0,en:"Histogram equalization works on the whole image and always aims for a flat histogram, so it is not the best choice for every application. Histogram matching, or specification, produces an output whose histogram matches a specified target histogram. The mapping is found in three steps: equalize the input, equalize the target, then relate the two.",
   bn:"হিস্টোগ্রাম ইকুয়ালাইজেশন পুরো ইমেজে কাজ করে এবং সবসময় সমতল হিস্টোগ্রাম চায়, তাই সব কাজের জন্য এটি সেরা নয়। হিস্টোগ্রাম ম্যাচিং বা স্পেসিফিকেশন এমন আউটপুট তৈরি করে যার হিস্টোগ্রাম একটি নির্দিষ্ট টার্গেট হিস্টোগ্রামের সাথে মেলে। ম্যাপিং তিন ধাপে পাওয়া যায়: ইনপুট ইকুয়ালাইজ করো, টার্গেট ইকুয়ালাইজ করো, তারপর দুটোকে মেলাও।"},
 {scene:"ex",k:0,fx:(svg,_)=>{_.tb.clear();for(let r=0;r<8;r++)_.tb.set(r,5,"");_.h3.set([0,0,0,0,0,0,0,0],30);$$(svg,"#hm-f").textContent="s: equalized input · G(z): equalized target"},
   en:"Example: a 64-pixel, 3-bit image and a target histogram. Equalizing the input gives s equal to 1, 2, 3, 3, 5, 6, 7, 7. Equalizing the target gives G of z equal to 0, 0, 0, 0, 2, 4, 6, 7.",
   bn:"উদাহরণ: একটি ৬৪-পিক্সেলের ৩-বিট ইমেজ ও একটি টার্গেট হিস্টোগ্রাম। ইনপুট ইকুয়ালাইজ করলে s হয় ১, ২, ৩, ৩, ৫, ৬, ৭, ৭। টার্গেট ইকুয়ালাইজ করলে G(z) হয় ০, ০, ০, ০, ২, ৪, ৬, ৭।"},
 {scene:"ex",k:0,fx:(svg,_)=>{const L=[];for(let r=0;r<8;r++)L.push([900,()=>{_.tb.clear();_.tb.hl(r);_.tb.set(r,5,_.Z[r]);const s=+_.tb.cells[r][2].t.textContent;$$(svg,"#hm-f").textContent=`r = ${r}: s = ${s} → smallest z with G(z) ≥ ${s} is ${_.Z[r]}`}]);
   L.reset=()=>{_.tb.clear();for(let r=0;r<8;r++)_.tb.set(r,5,"")};return seq(L,true,2500)},
   en:"For each input level, take its s and find the target level z whose G of z is closest, taking the smallest z with G of z at least s. So 0 and 1 map to 4, 2 and 3 map to 5, 4 and 5 map to 6, and 6 and 7 map to 7.",
   bn:"প্রতিটি ইনপুট লেভেলের s নিয়ে এমন টার্গেট লেভেল z খোঁজো যার G(z) সবচেয়ে কাছে, অর্থাৎ যে সবচেয়ে ছোট z-এর G(z) কমপক্ষে s। তাই ০ ও ১ যায় ৪-এ, ২ ও ৩ যায় ৫-এ, ৪ ও ৫ যায় ৬-এ, আর ৬ ও ৭ যায় ৭-এ।"},
 {scene:"ex",k:0,fx:(svg,_)=>{const n=[8,10,10,2,12,16,4,2],o=new Array(8).fill(0);n.forEach((v,k)=>o[_.Z[k]]+=v);_.h3.set(o,30);for(let r=0;r<8;r++)_.tb.set(r,5,_.Z[r]);$$(svg,"#hm-f").textContent="output: 0 0 0 0 18 12 28 6"},
   en:"Moving the pixel counts gives the output histogram: 18 at level 4, 12 at level 5, 28 at level 6 and 6 at level 7. Its shape now follows the target, concentrated in the upper levels.",
   bn:"পিক্সেল সংখ্যা সরালে আউটপুট হিস্টোগ্রাম হয়: লেভেল ৪-এ ১৮, লেভেল ৫-এ ১২, লেভেল ৬-এ ২৮ এবং লেভেল ৭-এ ৬। এর আকার এখন টার্গেটের মতো, উপরের লেভেলগুলোতে কেন্দ্রীভূত।"}
],
points:[{en:"Steps: equalize input (s = T(r)); equalize target (G(z)); map r → z with G(z) ≈ s.",bn:"ধাপ: ইনপুট ইকুয়ালাইজ (s = T(r)); টার্গেট ইকুয়ালাইজ (G(z)); G(z) ≈ s ধরে r → z।"},{en:"Example output histogram: 0 0 0 0 18 12 28 6.",bn:"উদাহরণের আউটপুট হিস্টোগ্রাম: ০ ০ ০ ০ ১৮ ১২ ২৮ ৬।"}]},

{id:"local",slides:"113–118",title:{en:"Local histogram processing",bn:"লোকাল হিস্টোগ্রাম প্রসেসিং"},
svg:`<g id="lh-i"></g><g id="lh-k"></g>`,
init(svg,_){const I=gen("squares",128);const g=$$(svg,"#lh-i");_.a=img2(g,30,80,230,230,"original");_.a.show(I);_.b=img2(g,285,80,230,230,"global equalization");_.c=img2(g,540,80,230,230,"local equalization");
  _.b.show(equalize(I));_.c.show(localEq(I,3));_.b.g.style.opacity=.15;_.c.g.style.opacity=.15;_.win=el($$(svg,"#lh-k"),"rect",{x:30,y:80,width:14,height:14,class:"kbox"})},
steps:[
 {k:0,fx:(svg,_)=>{_.b.g.style.opacity=.15;_.c.g.style.opacity=.15;_.win.style.opacity=0},en:"The methods so far are global: one transformation for the whole image, based on its overall intensity distribution. This works for overall enhancement but fails for details in small areas, because those few pixels barely affect the global histogram. This image has five dark squares with objects hidden inside, practically invisible.",
   bn:"এ পর্যন্ত পদ্ধতিগুলো গ্লোবাল: পুরো ইমেজের সামগ্রিক তীব্রতার বণ্টনের ভিত্তিতে একটি ট্রান্সফরমেশন। সামগ্রিক উন্নতির জন্য এটি কাজ করে, কিন্তু ছোট অঞ্চলের খুঁটিনাটির জন্য ব্যর্থ হয়, কারণ ওই অল্প পিক্সেল গ্লোবাল হিস্টোগ্রামে প্রায় প্রভাব ফেলে না। এই ইমেজে পাঁচটি অন্ধকার বর্গ আছে, যাদের ভেতরে বস্তু লুকানো, প্রায় দেখাই যায় না।"},
 {k:0,fx:(svg,_)=>{_.b.g.style.opacity=1;_.c.g.style.opacity=.15;_.win.style.opacity=0},en:"Global histogram equalization mostly enhances the noise in the smooth regions. It does not reveal any new significant detail.",
   bn:"গ্লোবাল হিস্টোগ্রাম ইকুয়ালাইজেশন মূলত মসৃণ অঞ্চলের নয়েজ বাড়িয়ে দেয়। এটি নতুন কোনো গুরুত্বপূর্ণ খুঁটিনাটি দেখায় না।"},
 {k:0,fx:(svg,_)=>{_.b.g.style.opacity=1;_.c.g.style.opacity=1;_.win.style.opacity=1;return rafLoop(t=>{const u=(t*.08)%1,row=Math.floor(u*8),col=(u*8%1);_.win.setAttribute("x",30+col*216);_.win.setAttribute("y",80+row*27)})},
   en:"Local histogram processing defines a small neighbourhood and moves its centre from pixel to pixel. At each location, the histogram of the neighbourhood is computed and used to map only the centre pixel. Now the details inside all the dark squares appear. Updating the histogram as the window slides one step is cheaper than recomputing it, and non-overlapping regions are faster but produce a blocky effect.",
   bn:"লোকাল হিস্টোগ্রাম প্রসেসিংয়ে একটি ছোট নেইবারহুড নিয়ে তার কেন্দ্র পিক্সেল থেকে পিক্সেলে সরানো হয়। প্রতিটি জায়গায় নেইবারহুডের হিস্টোগ্রাম হিসাব করে শুধু মাঝের পিক্সেলটি ম্যাপ করা হয়। এখন সব অন্ধকার বর্গের ভেতরের খুঁটিনাটি দেখা যাচ্ছে। উইন্ডো এক ধাপ সরলে হিস্টোগ্রাম নতুন করে না গুনে আপডেট করা সস্তা, আর না-ওভারল্যাপ করা অঞ্চল দ্রুত হলেও ব্লকের মতো প্রভাব তৈরি করে।"}
],
points:[{en:"Global methods fail for small regions; <b>local</b> methods compute the transform from each pixel's neighbourhood.",bn:"ছোট অঞ্চলের জন্য গ্লোবাল পদ্ধতি ব্যর্থ; <b>লোকাল</b> পদ্ধতি প্রতিটি পিক্সেলের নেইবারহুড থেকে ট্রান্সফর্ম হিসাব করে।"},{en:"The slides use a 3 × 3 neighbourhood; this demo uses 7 × 7 so the effect is visible on a small image.",bn:"স্লাইডে ৩ × ৩ নেইবারহুড; ছোট ইমেজে বোঝানোর জন্য এই ডেমোতে ৭ × ৭।"}]},
/* 15 */
{id:"stats",slides:"119–122",title:{en:"Histogram statistics: mean and variance",bn:"হিস্টোগ্রাম পরিসংখ্যান: গড় ও ভ্যারিয়েন্স"},
svg:`<g id="st-a"></g><g id="st-h"></g><text class="mono am" x="420" y="300">m = Σ r_k · p(r_k)</text><text class="mono am" x="420" y="330">σ² = Σ (r_k − m)² · p(r_k)</text><text id="st-m" class="mono lg" x="420" y="380"></text><text id="st-v" class="mono lg" x="420" y="414"></text>`,
init(svg,_){const A=[[0,0,1,1,2],[1,2,3,0,1],[3,3,2,2,0],[2,3,1,0,0],[1,1,3,2,2]];_.M=mat($$(svg,"#st-a"),{x:40,y:90,cs:56,data:A,label:"5 × 5 image, L = 4"});
  const n=[0,0,0,0];A.flat().forEach(v=>n[v]++);_.p=n.map(v=>v/25);_.H=bars($$(svg,"#st-h"),{x:440,y:70,w:300,h:160,n:4,labels:[0,1,2,3],title:"p(r_k)",values:1,fmtv:v=>v.toFixed(2)});_.H.set(_.p,.4)},
steps:[
 {k:0,fx:svg=>{$$(svg,"#st-m").textContent="";$$(svg,"#st-v").textContent=""},en:"Statistics from the histogram can guide enhancement. The mean, m, is the sum of each level times its probability. It measures average intensity. The variance, sigma squared, is the sum of the squared distance from the mean times the probability. It measures contrast.",
   bn:"হিস্টোগ্রাম থেকে পাওয়া পরিসংখ্যান এনহ্যান্সমেন্টে সাহায্য করে। গড় m হলো প্রতিটি লেভেল গুণ তার সম্ভাবনার যোগফল। এটি গড় তীব্রতা মাপে। ভ্যারিয়েন্স সিগমা স্কয়ার হলো গড় থেকে দূরত্বের বর্গ গুণ সম্ভাবনার যোগফল। এটি কনট্রাস্ট মাপে।"},
 {k:0,fx:(svg,_)=>{const m=_.p.reduce((s,p,k)=>s+k*p,0),v=_.p.reduce((s,p,k)=>s+(k-m)**2*p,0);return seq([[400,()=>$$(svg,"#st-m").textContent=`m = ${_.p.map((p,k)=>`${k}(${p.toFixed(2)})`).join(" + ")} = ${m.toFixed(2)}`],[1500,()=>$$(svg,"#st-v").textContent=`σ² = ${v.toFixed(4)}`]])},
   en:"For this 5 by 5 image with 4 levels, the probabilities are 0.24, 0.28, 0.28 and 0.20. The mean is 1.44, and the variance is about 1.13. Computing these locally, over each pixel's neighbourhood, lets us enhance only the regions that need it, for example dark areas with low contrast.",

steps:[
 {k:0,fx:(svg,_)=>{_.K.at(0,0);$$(svg,"#mc-f").textContent=""},en:"In spatial filtering we do not work on a single pixel. We take a neighbourhood around it, combine the neighbours, and put the result at the centre pixel. The name filter comes from the frequency domain, where filters pass or reject frequency components. A low-pass filter, for example, smooths by blurring, and the same can be done directly on the image with a spatial filter, also called a mask or kernel.",
   bn:"স্পেশাল ফিল্টারিংয়ে আমরা একটি পিক্সেল নিয়ে কাজ করি না। এর চারপাশের একটি নেইবারহুড নিয়ে প্রতিবেশীদের একত্র করে ফলাফল মাঝের পিক্সেলে বসাই। ফিল্টার নামটি এসেছে ফ্রিকোয়েন্সি ডোমেইন থেকে, যেখানে ফিল্টার কিছু ফ্রিকোয়েন্সি পার হতে দেয় বা আটকায়। যেমন লো-পাস ফিল্টার ঝাপসা করে মসৃণ করে, আর একই কাজ সরাসরি ইমেজে স্পেশাল ফিল্টার দিয়ে করা যায়, যাকে মাস্ক বা কার্নেলও বলে।"},
 {k:0,fx:(svg,_)=>{const Ls=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)Ls.push([650,()=>{_.K.at(r,c);let s=0;const t=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){s+=_.A[r+i][c+j];t.push(_.A[r+i][c+j])}_.O.set(r,c,(s/9).toFixed(1));_.O.clear("a");_.O.cls(r,c,"a");$$(svg,"#mc-f").textContent=`(${t.join("+")}) / 9 = ${(s/9).toFixed(2)}`}]);
   Ls.reset=()=>{for(let r=0;r<4;r++)for(let c=0;c<4;c++)_.O.set(r,c,"");_.O.clear("a")};return seq(Ls,true,2500)},
   en:"A linear spatial filter computes a sum of products. The centre coefficient w of 0, 0 sits on the pixel at x, y. Each kernel coefficient is multiplied by the pixel under it, the products are added, and the sum becomes g of x y. Then the kernel moves to the next pixel, and the process repeats across the whole image.",
   bn:"লিনিয়ার স্পেশাল ফিল্টার গুণফলের যোগফল হিসাব করে। কার্নেলের মাঝের সহগ w(০, ০) বসে x, y পিক্সেলের উপর। প্রতিটি সহগ তার নিচের পিক্সেলের সাথে গুণ হয়, গুণফলগুলো যোগ হয়, আর যোগফলটি হয় g(x, y)। তারপর কার্নেল পরের পিক্সেলে সরে যায়, এবং পুরো ইমেজ জুড়ে একই কাজ চলে।"}
],
points:[{en:"Kernel (mask, filter) centre w(0,0) aligned with f(x,y); output = <b>sum of products</b>; then move to the next pixel.",bn:"কার্নেলের (মাস্ক, ফিল্টার) কেন্দ্র w(০,০) f(x,y)-এর উপর; আউটপুট = <b>গুণফলের যোগফল</b>; তারপর পরের পিক্সেলে।"},{en:"If the operation on the neighbourhood is linear → linear spatial filtering.",bn:"নেইবারহুডের অপারেশন রৈখিক হলে → লিনিয়ার স্পেশাল ফিল্টারিং।"}]},

   bn:"কনভোলিউশনও একই প্রক্রিয়া, শুধু আগে কার্নেলকে ১৮০ ডিগ্রি ঘুরিয়ে নেওয়া হয়। এখন ইমপালস থেকে কার্নেলের হুবহু কপি পাওয়া যায়। দ্বিমাত্রায় ১৮০ ডিগ্রি ঘোরানো মানে কার্নেলকে আনুভূমিক ও উল্লম্ব দুই দিকেই উল্টানো। প্রতিসম কার্নেলে কোরিলেশন ও কনভোলিউশন একই ফল দেয়।"}

steps:[
 {scene:"tree",k:0,en:"Spatial filters fall into two groups: smoothing and sharpening. Smoothing filters can be linear, like the box and weighted average filters, or non-linear, like median, min and max. Sharpening uses derivatives.",
   bn:"স্পেশাল ফিল্টার দুই দলে ভাগ: স্মুথিং ও শার্পেনিং। স্মুথিং ফিল্টার লিনিয়ার হতে পারে, যেমন বক্স ও ওয়েটেড অ্যাভারেজ ফিল্টার, অথবা নন-লিনিয়ার, যেমন মিডিয়ান, মিন ও ম্যাক্স। শার্পেনিংয়ে ডেরিভেটিভ ব্যবহৃত হয়।"},
 {scene:"box",k:0,en:"Smoothing, or averaging, filters reduce sharp transitions in intensity. Since random noise consists of sharp transitions, the main use is noise reduction. They are also called low-pass filters. The standard average, or box, filter replaces each pixel by the average of its 3 by 3 neighbours. For this example, the sum is 45, and 45 over 9 is 5. The weighted average filter gives more weight to the centre to reduce blurring.",
   bn:"স্মুথিং বা অ্যাভারেজিং ফিল্টার তীব্রতার আকস্মিক পরিবর্তন কমায়। এলোমেলো নয়েজ যেহেতু আকস্মিক পরিবর্তন দিয়ে তৈরি, তাই এর প্রধান ব্যবহার নয়েজ কমানো। এদের লো-পাস ফিল্টারও বলে। স্ট্যান্ডার্ড অ্যাভারেজ বা বক্স ফিল্টার প্রতিটি পিক্সেলকে তার ৩ বাই ৩ প্রতিবেশীর গড় দিয়ে বদলায়। এই উদাহরণে যোগফল ৪৫, আর ৪৫ ভাগ ৯ হলো ৫। ওয়েটেড অ্যাভারেজ ফিল্টার ঝাপসা কমাতে মাঝের পিক্সেলকে বেশি ওজন দেয়।"},
 {scene:"demo",k:0,en:"The drawback of averaging is that it blurs edges. Larger kernels, like 11 by 11 and 21 by 21, blur more and more.",
   bn:"অ্যাভারেজিংয়ের অসুবিধা হলো এটি কিনারা ঝাপসা করে। বড় কার্নেল, যেমন ১১ বাই ১১ ও ২১ বাই ২১, আরও বেশি ঝাপসা করে।"},
 {scene:"hub",k:0,en:"Blurring can be useful. To extract large objects, average with a large mask so small objects blend into the background, then threshold. This is how the brightest large objects are picked out of a Hubble telescope image. Smoothing also removes small objects and bridges small gaps in lines and curves.",
   bn:"ঝাপসা করাও কাজে লাগতে পারে। বড় বস্তু আলাদা করতে বড় মাস্ক দিয়ে গড় নিলে ছোট বস্তুগুলো ব্যাকগ্রাউন্ডে মিশে যায়, তারপর থ্রেশহোল্ড করা হয়। এভাবেই হাবল টেলিস্কোপের ছবি থেকে সবচেয়ে উজ্জ্বল বড় বস্তুগুলো আলাদা করা হয়। স্মুথিং ছোট বস্তু দূর করে এবং রেখা ও বক্ররেখার ছোট ফাঁকও জোড়া লাগায়।"}
],
points:[{en:"Smoothing (averaging, low-pass): noise reduction, blurring, removing small objects, bridging gaps.",bn:"স্মুথিং (অ্যাভারেজিং, লো-পাস): নয়েজ কমানো, ঝাপসা করা, ছোট বস্তু সরানো, ফাঁক জোড়া।"},{en:"Box filter: 1/9 of all ones; example average = 45/9 = 5. Weighted average: the standard 3 × 3 kernel is 1/16 [1 2 1; 2 4 2; 1 2 1].",bn:"বক্স ফিল্টার: সব ১, ভাগ ৯; উদাহরণের গড় = ৪৫/৯ = ৫। ওয়েটেড অ্যাভারেজ: আদর্শ ৩ × ৩ কার্নেল ১/১৬ [১ ২ ১; ২ ৪ ২; ১ ২ ১]।"}]},

init(svg,_){const B=gen("board",128),N=noiseSP(B,.2);const g=$$(svg,"#nl-i");img2(g,30,90,220,220,"salt and pepper noise").show(N);img2(g,290,90,220,220,"3 × 3 average").show(boxBlur(N,3));img2(g,550,90,220,220,"3 × 3 median").show(rankF(N,1,"med"));
  const D=[[1,8,8,0,7],[4,7,9,5,7],[5,4,6,8,6],[4,2,0,1,5],[0,1,0,2,0]];_.D=D;_.M=mat($$(svg,"#nl-m"),{x:40,y:90,cs:56,data:D,label:"centre pixel: 6"});_.M.cls(2,2,"d");for(let r=1;r<4;r++)for(let c=1;c<4;c++)if(r!==2||c!==2)_.M.cls(r,c,"on");
  _.S=mat($$(svg,"#nl-s"),{x:430,y:120,cs:36,data:[Array(9).fill("")],label:"neighbourhood values"})},
steps:[
 {scene:"sp",k:0,en:"Non-linear smoothing filters are based on ordering the pixels in the neighbourhood. They are mainly used for impulse, or salt and pepper, noise. The median filter replaces each pixel by the median of its neighbours. Averaging smears the noise dots, but the median removes them almost completely.",
   bn:"নন-লিনিয়ার স্মুথিং ফিল্টার নেইবারহুডের পিক্সেলগুলো সাজানোর উপর ভিত্তি করে কাজ করে। এগুলো প্রধানত ইমপালস বা সল্ট অ্যান্ড পেপার নয়েজের জন্য ব্যবহৃত হয়। মিডিয়ান ফিল্টার প্রতিটি পিক্সেলকে তার প্রতিবেশীদের মিডিয়ান দিয়ে বদলায়। অ্যাভারেজিং নয়েজের বিন্দুগুলো ছড়িয়ে দেয়, কিন্তু মিডিয়ান এগুলো প্রায় পুরোপুরি দূর করে।"},
 {scene:"ex",k:0,fx:(svg,_)=>{const v=[];for(let r=1;r<4;r++)for(let c=1;c<4;c++)v.push(_.D[r][c]);const s=v.slice().sort((a,b)=>a-b);const W=[[1,2,1],[2,4,2],[1,2,1]];let ws=0;for(let r=0;r<3;r++)for(let c=0;c<3;c++)ws+=W[r][c]*_.D[r+1][c+1];
   ["#nl-r","#nl-r2","#nl-r3","#nl-r4"].forEach(q=>$$(svg,q).textContent="");
   return seq([[200,()=>v.forEach((x,i)=>{_.S.set(0,i,x);_.S.clear("a")})],[1400,()=>{s.forEach((x,i)=>_.S.set(0,i,x));_.S.cls(0,4,"a")}],
     [900,()=>$$(svg,"#nl-r").textContent=`mean = ${v.reduce((a,b)=>a+b,0)}/9 = ${(v.reduce((a,b)=>a+b,0)/9).toFixed(2)} ≈ ${Math.round(v.reduce((a,b)=>a+b,0)/9)}`],
     [900,()=>$$(svg,"#nl-r2").textContent=`weighted (1/16) = ${ws}/16 = ${(ws/16).toFixed(2)} ≈ ${Math.round(ws/16)}`],
     [900,()=>$$(svg,"#nl-r3").textContent=`median = ${s[4]}`],[900,()=>$$(svg,"#nl-r4").textContent=`max = ${s[8]}   min = ${s[0]}`]],true,3000)},
   en:"Let's compute all five for the centre pixel, 6. Its 3 by 3 neighbourhood holds 7, 9, 5, 4, 6, 8, 2, 0 and 1. The mean is 42 over 9, about 4.67, which rounds to 5. The weighted average is 81 over 16, about 5. Sorting the values, the middle one, the median, is 5. The max is 9 and the min is 0. Max filters find the brightest points, and min filters find the darkest.",
   bn:"চলো মাঝের পিক্সেল ৬-এর জন্য পাঁচটিই হিসাব করি। এর ৩ বাই ৩ নেইবারহুডে আছে ৭, ৯, ৫, ৪, ৬, ৮, ২, ০ ও ১। গড় হলো ৪২ ভাগ ৯, প্রায় ৪.৬৭, রাউন্ড করে ৫। ওয়েটেড অ্যাভারেজ ৮১ ভাগ ১৬, প্রায় ৫। মানগুলো সাজালে মাঝেরটি, অর্থাৎ মিডিয়ান, হলো ৫। ম্যাক্স ৯ আর মিন ০। ম্যাক্স ফিল্টার সবচেয়ে উজ্জ্বল বিন্দু খোঁজে, আর মিন ফিল্টার সবচেয়ে অন্ধকার।"}
],
points:[{en:"Median, min, max: order-statistic filters; median is best for <b>salt and pepper</b> noise.",bn:"মিডিয়ান, মিন, ম্যাক্স: অর্ডার-স্ট্যাটিস্টিক ফিল্টার; <b>সল্ট অ্যান্ড পেপার</b> নয়েজে মিডিয়ান সেরা।"},{en:"Example (centre 6): mean ≈ 5, weighted ≈ 5, median = 5, max = 9, min = 0.",bn:"উদাহরণ (কেন্দ্র ৬): গড় ≈ ৫, ওয়েটেড ≈ ৫, মিডিয়ান = ৫, ম্যাক্স = ৯, মিন = ০।"}]},

{id:"derivatives",slides:"30–36",title:{en:"Sharpening foundations: first and second derivatives",bn:"শার্পেনিংয়ের ভিত্তি: প্রথম ও দ্বিতীয় ডেরিভেটিভ"},

init(svg,_){const f=[5,5,4,3,2,1,0,0,0,6,0,0,0,0,1,3,1,0,0,0,0,7,7,7,7];const n=f.length,cw=29;const d1=f.map((v,i)=>i<n-1?f[i+1]-v:null),d2=f.map((v,i)=>i>0&&i<n-1?f[i+1]+f[i-1]-2*v:null);
  const g=$$(svg,"#dv-g");const row=(arr,y,h,cls,name,sc)=>{const q=el(g,"g",{style:"transition:opacity .5s"});txt(q,20,y+4,name,"sm mono");el(q,"line",{x1:110,x2:110+n*cw,y1:y,y2:y,class:"axis"});
    arr.forEach((v,i)=>{if(v==null)return;const hh=v*sc;el(q,"rect",{x:110+i*cw+5,y:hh>0?y-hh:y,width:cw-10,height:Math.abs(hh)||1.5,class:cls});txt(q,110+i*cw+cw/2,y+(v>=0?16:-Math.abs(hh)-6)+(v>=0?0:0),String(v),"c xs mono")});return q};
  _.r0=row(f,150,0,"hbar","f(x)",12);_.r1=row(d1,268,0,"hbar2","∂f/∂x",6);_.r2=row(d2,388,0,"hbar","∂²f/∂x²",4);
  [["ramp",2,5],["point",9,9],["line",14,16],["step",20,22]].forEach(([t,a,b])=>{el(g,"rect",{x:110+a*cw,y:16,width:(b-a+1)*cw,height:20,rx:4,style:"fill:none;stroke:#7D8FA6;stroke-dasharray:3 3"});txt(g,110+(a+b+1)/2*cw,31,t,"c xs")})},
steps:[
 {k:0,fx:(svg,_)=>{_.r1.style.opacity=.1;_.r2.style.opacity=.1},en:"Smoothing averages pixels, which is like integration. So sharpening can be done by differentiation. A derivative responds strongly to intensity discontinuities, such as edges and noise, and weakly to slowly varying areas. Here is a scan line containing a ramp, an isolated point, a thin line and a step.",
   bn:"স্মুথিং পিক্সেলের গড় নেয়, যা ইন্টিগ্রেশনের মতো। তাই শার্পেনিং করা যায় ডিফারেনশিয়েশন দিয়ে। ডেরিভেটিভ তীব্রতার আকস্মিক পরিবর্তনে, যেমন কিনারা ও নয়েজে জোরালো সাড়া দেয়, আর ধীরে বদলানো অঞ্চলে দুর্বল সাড়া দেয়। এখানে একটি স্ক্যান লাইন আছে, যাতে একটি র‍্যাম্প, একটি একক বিন্দু, একটি সরু রেখা ও একটি ধাপ রয়েছে।"},
 {k:0,fx:(svg,_)=>{_.r1.style.opacity=1;_.r2.style.opacity=.1},en:"The first derivative uses a look-ahead difference: f of x plus 1 minus f of x. It must be zero in constant areas, nonzero at the onset of a step or ramp, and nonzero along ramps. Notice the long run of minus ones along the ramp.",
   bn:"প্রথম ডেরিভেটিভ সামনের পার্থক্য ব্যবহার করে: f(x যোগ ১) বিয়োগ f(x)। সমান অঞ্চলে এটি অবশ্যই শূন্য, ধাপ বা র‍্যাম্পের শুরুতে অশূন্য, এবং র‍্যাম্প বরাবর অশূন্য। দেখো, র‍্যাম্প বরাবর একটানা বিয়োগ এক।"},
 {k:0,fx:(svg,_)=>{_.r1.style.opacity=1;_.r2.style.opacity=1},en:"The second derivative is f of x plus 1, plus f of x minus 1, minus 2 f of x. It is zero in constant areas, nonzero at the onset and end of steps and ramps, and zero along ramps. At the step it gives a positive and a negative value: the line joining them crosses zero midway, a zero crossing, useful for locating edges. Because edges are usually ramps, the second derivative enhances fine detail much better than the first.",
   bn:"দ্বিতীয় ডেরিভেটিভ হলো f(x যোগ ১) যোগ f(x বিয়োগ ১) বিয়োগ ২ f(x)। সমান অঞ্চলে এটি শূন্য, ধাপ ও র‍্যাম্পের শুরু ও শেষে অশূন্য, আর র‍্যাম্প বরাবর শূন্য। ধাপে এটি একটি ধনাত্মক ও একটি ঋণাত্মক মান দেয়: এদের সংযোগকারী রেখা মাঝখানে শূন্য ছেদ করে, একে বলে জিরো ক্রসিং, যা কিনারা খুঁজতে কাজে লাগে। কিনারা সাধারণত র‍্যাম্পের মতো হয়, তাই দ্বিতীয় ডেরিভেটিভ সূক্ষ্ম খুঁটিনাটি প্রথমটির চেয়ে অনেক ভালোভাবে স্পষ্ট করে।"}
],
points:[{en:"∂f/∂x = f(x+1) − f(x): zero in flat areas, nonzero at onset of steps/ramps and <b>along ramps</b>.",bn:"∂f/∂x = f(x+১) − f(x): সমান অঞ্চলে শূন্য, ধাপ/র‍্যাম্পের শুরুতে ও <b>র‍্যাম্প বরাবর</b> অশূন্য।"},{en:"∂²f/∂x² = f(x+1) + f(x−1) − 2f(x): zero along ramps; <b>zero crossing</b> at steps; better for fine detail.",bn:"∂²f/∂x² = f(x+১) + f(x−১) − ২f(x): র‍্যাম্প বরাবর শূন্য; ধাপে <b>জিরো ক্রসিং</b>; সূক্ষ্ম খুঁটিনাটিতে ভালো।"}]},

{id:"laplacian",slides:"37–45",title:{en:"The Laplacian",bn:"ল্যাপ্লাসিয়ান"},
svg:`<g data-scene="mk"><g data-s="0"><text class="mono am" x="40" y="50">∇²f = f(x+1,y) + f(x−1,y) + f(x,y+1) + f(x,y−1) − 4f(x,y)</text><g id="lp-k"></g>
  <text class="mono sm" x="40" y="400">g(x,y) = f(x,y) + c·∇²f(x,y)    c = −1 if the centre is negative, +1 if positive</text></g></g>
<g data-scene="ex"><g data-s="0"><g id="lp-p"></g><g id="lp-b"></g><g id="lp-l"></g><g id="lp-g"></g><text id="lp-f" class="mono am sm" x="40" y="420"></text></g></g>
<g data-scene="im"><g data-s="0"><g id="lp-i"></g></g></g>`,
init(svg,_){const K=[[[0,1,0],[1,-4,1],[0,1,0]],[[0,-1,0],[-1,4,-1],[0,-1,0]],[[1,1,1],[1,-8,1],[1,1,1]],[[-1,-1,-1],[-1,8,-1],[-1,-1,-1]]];
  K.forEach((k,i)=>mat($$(svg,"#lp-k"),{x:40+i*190,y:110,cs:50,data:k,label:i<2?"4-neighbour":"with diagonals"}));txt($$(svg,"#lp-k"),400,320,"coefficients of every Laplacian mask sum to 0","c dim");
  const F=[[50,60,90,100],[50,60,90,100],[50,60,90,100],[50,60,90,100]];_.P=pad(F);_.Pm=mat($$(svg,"#lp-p"),{x:30,y:70,cs:40,fs:12,data:_.P,label:"pixel replication"});_.Kb=kbox($$(svg,"#lp-b"),_.Pm,3);
  _.L=mat($$(svg,"#lp-l"),{x:330,y:110,cs:44,fs:13,data:F.map(r=>r.map(()=>"")),label:"Laplacian (centre +4)"});_.G=mat($$(svg,"#lp-g"),{x:560,y:110,cs:44,fs:13,data:F.map(r=>r.map(()=>"")),label:"sharpened f + ∇²"});
  const I=boxBlur(SC(),3);img2($$(svg,"#lp-i"),30,90,220,220,"slightly blurred").show(I);img2($$(svg,"#lp-i"),290,90,220,220,"sharpened, 4-neighbour").show(sharp(I,[[0,-1,0],[-1,4,-1],[0,-1,0]],1));img2($$(svg,"#lp-i"),550,90,220,220,"sharpened, with diagonals").show(sharp(I,[[-1,-1,-1],[-1,8,-1],[-1,-1,-1]],1))},
steps:[
 {scene:"mk",k:0,en:"The Laplacian is the simplest isotropic second derivative operator. In discrete form it adds the four neighbours and subtracts 4 times the centre. Masks can include the diagonals too, with minus 8 at the centre, and the signs can be reversed. The coefficients of every Laplacian mask sum to zero. To sharpen, add the Laplacian image to the original, with c equal to minus 1 when the centre coefficient is negative.",
   bn:"ল্যাপ্লাসিয়ান হলো সবচেয়ে সরল আইসোট্রপিক দ্বিতীয় ডেরিভেটিভ অপারেটর। বিচ্ছিন্ন রূপে এটি চারটি প্রতিবেশী যোগ করে মাঝের পিক্সেলের ৪ গুণ বিয়োগ করে। মাস্কে কোণাকুণি প্রতিবেশীও থাকতে পারে, তখন মাঝে বিয়োগ ৮, এবং চিহ্নগুলো উল্টেও নেওয়া যায়। প্রতিটি ল্যাপ্লাসিয়ান মাস্কের সহগের যোগফল শূন্য। শার্পেন করতে ল্যাপ্লাসিয়ান ইমেজ মূল ইমেজের সাথে যোগ করা হয়, মাঝের সহগ ঋণাত্মক হলে c সমান বিয়োগ ১।"},
 {scene:"ex",k:0,fx:(svg,_)=>{const K=[[0,-1,0],[-1,4,-1],[0,-1,0]];const Ls=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)Ls.push([420,()=>{_.Kb.at(r,c);const l=apply3(_.P,K,r,c);_.L.set(r,c,l);_.G.set(r,c,_.P[r+1][c+1]+l);_.G.clear("a");_.G.cls(r,c,"a");$$(svg,"#lp-f").textContent=`4×${_.P[r+1][c+1]} − (${_.P[r][c+1]}+${_.P[r+2][c+1]}+${_.P[r+1][c]}+${_.P[r+1][c+2]}) = ${l};  g = ${_.P[r+1][c+1]} + ${l} = ${_.P[r+1][c+1]+l}`}]);
   Ls.reset=()=>{for(let r=0;r<4;r++)for(let c=0;c<4;c++){_.L.set(r,c,"");_.G.set(r,c,"")}_.G.clear("a")};return seq(Ls,true,3000)},
   en:"Worked example: apply the mask with plus 4 at the centre to a blurred edge, 50, 60, 90, 100, using pixel replication at the border. The Laplacian is minus 10, minus 20, 20 and 10. Adding it to the original gives 40, 40, 110, 110. The contrast rises from 100 minus 50, which is 50, to 110 minus 40, which is 70. The edge is sharper.",
   bn:"উদাহরণ: একটি ঝাপসা কিনারা ৫০, ৬০, ৯০, ১০০-এ মাঝে যোগ ৪ থাকা মাস্কটি প্রয়োগ করো, কিনারায় পিক্সেল রেপ্লিকেশন ব্যবহার করে। ল্যাপ্লাসিয়ান হয় বিয়োগ ১০, বিয়োগ ২০, ২০ ও ১০। মূল ইমেজের সাথে যোগ করলে পাওয়া যায় ৪০, ৪০, ১১০, ১১০। কনট্রাস্ট ১০০ বিয়োগ ৫০, অর্থাৎ ৫০ থেকে বেড়ে ১১০ বিয়োগ ৪০, অর্থাৎ ৭০ হয়। কিনারা আরও তীক্ষ্ণ হয়েছে।"},
 {scene:"im",k:0,en:"On a real image, the Laplacian highlights edges and fine detail. The mask that also uses the diagonal directions gives a noticeably sharper result, because it adds differentiation in those directions too.",
   bn:"বাস্তব ইমেজে ল্যাপ্লাসিয়ান কিনারা ও সূক্ষ্ম খুঁটিনাটি স্পষ্ট করে। যে মাস্ক কোণাকুণি দিকও ব্যবহার করে তা লক্ষণীয়ভাবে বেশি তীক্ষ্ণ ফল দেয়, কারণ সেই দিকেও ডিফারেনশিয়েশন যোগ হয়।"}
],
points:[{en:"Laplacian masks: [0 1 0; 1 −4 1; 0 1 0], with diagonals −8; signs may be reversed; coefficients sum to 0.",bn:"ল্যাপ্লাসিয়ান মাস্ক: [০ ১ ০; ১ −৪ ১; ০ ১ ০], কোণাকুণিসহ −৮; চিহ্ন উল্টানো যায়; যোগফল ০।"},{en:"Example: 50 60 90 100 → Laplacian −10 −20 20 10 → sharpened 40 40 110 110; contrast 50 → 70.",bn:"উদাহরণ: ৫০ ৬০ ৯০ ১০০ → ল্যাপ্লাসিয়ান −১০ −২০ ২০ ১০ → শার্প ৪০ ৪০ ১১০ ১১০; কনট্রাস্ট ৫০ → ৭০।"}]},
/* 7 */
{id:"unsharp",slides:"46–49",title:{en:"Unsharp masking and high-boost filtering",bn:"আনশার্প মাস্কিং ও হাই-বুস্ট ফিল্টারিং"},
svg:`<g data-scene="st"><g data-s="0"><text class="h" x="40" y="50">THREE STEPS</text><text class="mono lg" x="40" y="110">1 · blur:          f̄(x,y)</text><text class="mono lg" x="40" y="160">2 · mask:   g_mask = f − f̄</text><text class="mono lg am" x="40" y="210">3 · add:    g = f + k · g_mask</text>
  <text class="sm" x="40" y="280">k = 1 → unsharp masking</text><text class="sm" x="40" y="310">k &gt; 1 → high-boost filtering</text><g id="us-row"></g></g></g>
<g data-scene="im"><g data-s="0"><g id="us-i"></g></g></g>`,
init(svg,_){const f=[50,60,90,100],b=[53,67,83,97],m=[-3,-7,7,3];const g=$$(svg,"#us-row");
  [["f",f],["f̄ (1/9 box)",b],["mask",m],["k = 1",f.map((v,i)=>v+m[i])],["k = 3",f.map((v,i)=>v+3*m[i])]].forEach(([n,a],r)=>{txt(g,430,95+r*56,n,"mono sm");mat(g,{x:560,y:72+r*56,cs:44,fs:13,data:[a]})});
  const I=boxBlur(SC(),3),B=boxBlur(I,5);_.I=I;_.B=B;const q=$$(svg,"#us-i");img2(q,30,90,220,220,"original (soft)").show(I);img2(q,290,90,220,220,"mask f − f̄ (scaled)").show({w:128,h:128,a:I.a.map((v,i)=>v-B.a[i])},1);_.o=img2(q,550,90,220,220,"k = 1");_.o.show(mapI(I,(v,i)=>v+(v-B.a[i])))},
steps:[
 {scene:"st",k:0,en:"Unsharp masking, a technique long used in printing, sharpens in three steps. Blur the original. Subtract the blurred image from the original to get the mask. Then add the mask back, multiplied by k. With k equal to 1 it is unsharp masking. With k greater than 1 it is high-boost filtering. In the example, the blurred row is 53, 67, 83, 97, the mask is minus 3, minus 7, 7, 3, and k equal to 1 gives 47, 53, 97, 103.",
   bn:"আনশার্প মাস্কিং, যা ছাপাখানায় বহুদিন ধরে ব্যবহৃত, তিন ধাপে শার্পেন করে। মূল ইমেজকে ঝাপসা করো। মূল ইমেজ থেকে ঝাপসা ইমেজ বিয়োগ করে মাস্ক পাও। তারপর মাস্ককে k দিয়ে গুণ করে আবার যোগ করো। k সমান ১ হলে আনশার্প মাস্কিং। k ১-এর বেশি হলে হাই-বুস্ট ফিল্টারিং। উদাহরণে ঝাপসা সারি ৫৩, ৬৭, ৮৩, ৯৭, মাস্ক বিয়োগ ৩, বিয়োগ ৭, ৭, ৩, আর k সমান ১ দিলে পাওয়া যায় ৪৭, ৫৩, ৯৭, ১০৩।"},
 {scene:"im",k:0,fx:(svg,_)=>{const K=[1,2,3];let i=0;return every(1500,()=>{const k=K[i%3];_.o.show(mapI(_.I,(v,j)=>v+k*(v-_.B.a[j])));_.o.lb.textContent=k===1?"k = 1 · unsharp masking":`k = ${k} · high-boost`;i++})},
   en:"On a soft image, the mask holds the edges. Adding it back with k equal to 1, 2 and 3 makes the image progressively sharper. With k equal to 3, the example row becomes 41, 39, 111, 109. Too large a k exaggerates edges and noise. Try it with the slider below.",
   bn:"নরম একটি ইমেজে মাস্কের মধ্যে কিনারাগুলো থাকে। k সমান ১, ২ ও ৩ দিয়ে এটি আবার যোগ করলে ইমেজ ক্রমশ আরও তীক্ষ্ণ হয়। k সমান ৩ হলে উদাহরণের সারি হয় ৪১, ৩৯, ১১১, ১০৯। k খুব বড় হলে কিনারা ও নয়েজ অতিরিক্ত হয়ে যায়। নিচের স্লাইডারে চেষ্টা করো।"}
],
panel:()=>`<h3>${tr({en:"Try it: k",bn:"নিজে করো: k"})}</h3><div class="prow">${sl("uk","k",0,5,.1,1)}</div><img id="uim" alt="" width="256" height="256" style="border-radius:6px;max-width:100%">`,
bind(root){const I=boxBlur(SC(),3),B=boxBlur(I,5);const f=()=>{const k=+root.querySelector("#uk").value;root.querySelector("#uko").textContent=k.toFixed(1);root.querySelector("#uim").src=toURL(mapI(I,(v,j)=>v+k*(v-B.a[j])))};root.querySelector("#uk").oninput=f;f()},
points:[{en:"g_mask = f − f̄; <b>g = f + k·g_mask</b>. k = 1 unsharp masking; k &gt; 1 high-boost.",bn:"g_mask = f − f̄; <b>g = f + k·g_mask</b>। k = ১ আনশার্প মাস্কিং; k &gt; ১ হাই-বুস্ট।"},{en:"Example: f = 50 60 90 100, f̄ = 53 67 83 97, mask = −3 −7 7 3 → k=1: 47 53 97 103; k=3: 41 39 111 109.",bn:"উদাহরণ: f = ৫০ ৬০ ৯০ ১০০, f̄ = ৫৩ ৬৭ ৮৩ ৯৭, মাস্ক = −৩ −৭ ৭ ৩ → k=১: ৪৭ ৫৩ ৯৭ ১০৩; k=৩: ৪১ ৩৯ ১১১ ১০৯।"}]},
/* 8 */
{id:"gradient",slides:"50–60",title:{en:"The gradient: Roberts and Sobel",bn:"গ্রেডিয়েন্ট: রবার্টস ও সোবেল"},
svg:`<g data-scene="def"><g data-s="0"><text class="mono am lg" x="40" y="60">∇f = [g_x, g_y],   M(x,y) = √(g_x² + g_y²) ≈ |g_x| + |g_y|</text>
  <g id="gd-k"></g></g></g>
<g data-scene="ex"><g data-s="0"><g id="gd-a"></g><g id="gd-b"></g><text id="gd-f" class="mono" x="440" y="300"></text><text id="gd-f2" class="mono" x="440" y="330"></text><text id="gd-f3" class="mono am" x="440" y="364"></text></g></g>
<g data-scene="im"><g data-s="0"><g id="gd-i"></g></g></g>`,
init(svg,_){const k=$$(svg,"#gd-k");mat(k,{x:40,y:130,cs:50,data:[[-1,0],[0,1]],label:"Roberts g_x"});mat(k,{x:170,y:130,cs:50,data:[[0,-1],[1,0]],label:"Roberts g_y"});
  mat(k,{x:330,y:130,cs:50,data:[[-1,-2,-1],[0,0,0],[1,2,1]],label:"Sobel g_x"});mat(k,{x:530,y:130,cs:50,data:[[-1,0,1],[-2,0,2],[-1,0,1]],label:"Sobel g_y"});
  txt(k,40,340,"first derivative, non-linear because of the magnitude","dim sm");txt(k,40,366,"Sobel weights the centre row and column by 2 for some smoothing","dim sm");
  const A=[[10,10,10,200,200,200],[10,10,10,200,200,200],[10,10,10,200,200,200],[100,100,100,20,20,20],[100,100,100,20,20,20],[100,100,100,20,20,20]];_.A=A;
  _.M=mat($$(svg,"#gd-a"),{x:40,y:80,cs:52,fs:13,data:A});[["p1",1,1],["p2",1,2],["p3",2,1],["p4",2,2]].forEach(([n,r,c])=>{_.M.cls(r,c,"on");txt(_.M.g,40+c*52+4,80+r*52+12,n,"xs am")});_.Kb=kbox($$(svg,"#gd-b"),_.M,3);
  const I=SC();img2($$(svg,"#gd-i"),110,90,250,250,"image").show(I);img2($$(svg,"#gd-i"),440,90,250,250,"Sobel magnitude |g_x| + |g_y|").show(sobel(I),1)},
steps:[
 {scene:"def",k:0,en:"First derivatives in image processing are implemented with the magnitude of the gradient. The gradient is the vector of partial derivatives g x and g y, and its magnitude is the square root of g x squared plus g y squared, often approximated by the sum of absolute values. Roberts cross masks use 2 by 2 differences on the diagonals. Sobel masks are 3 by 3 and give the centre row or column a weight of 2.",
   bn:"ইমেজ প্রসেসিংয়ে প্রথম ডেরিভেটিভ প্রয়োগ করা হয় গ্রেডিয়েন্টের মান দিয়ে। গ্রেডিয়েন্ট হলো আংশিক ডেরিভেটিভ g x ও g y-এর ভেক্টর, আর এর মান হলো g x-এর বর্গ যোগ g y-এর বর্গের বর্গমূল, যা প্রায়ই পরম মানের যোগফল দিয়ে আনুমানিক ধরা হয়। রবার্টস ক্রস মাস্ক কোণাকুণি ২ বাই ২ পার্থক্য ব্যবহার করে। সোবেল মাস্ক ৩ বাই ৩, এবং মাঝের সারি বা কলামকে ২ ওজন দেয়।"},
 {scene:"ex",k:0,fx:(svg,_)=>{const Kx=[[-1,-2,-1],[0,0,0],[1,2,1]],Ky=[[-1,0,1],[-2,0,2],[-1,0,1]];const P=[["p1",1,1],["p2",1,2],["p3",2,1],["p4",2,2]];
   const Ls=P.map(([n,r,c])=>[1800,()=>{_.Kb.at(r-1,c-1);const gx=apply3(_.A,Kx,r-1,c-1),gy=apply3(_.A,Ky,r-1,c-1);$$(svg,"#gd-f").textContent=`${n}: g_x = ${gx}`;$$(svg,"#gd-f2").textContent=`     g_y = ${gy}`;$$(svg,"#gd-f3").textContent=`|g_x| + |g_y| = ${Math.abs(gx)+Math.abs(gy)}`}]);return seq(Ls,true,2000)},
   en:"Let's apply the Sobel masks to the shaded pixels. At p1, everything under the mask is 10, so both gradients are zero: a flat region. At p2 the mask straddles the vertical edge, and g y is large. At p3 it straddles the horizontal edge, and g x is large. At p4, near the corner, both are nonzero. The magnitude is large exactly at edges.",
   bn:"চলো চিহ্নিত পিক্সেলগুলোতে সোবেল মাস্ক প্রয়োগ করি। p1-এ মাস্কের নিচে সবই ১০, তাই দুটো গ্রেডিয়েন্টই শূন্য: একটি সমান অঞ্চল। p2-তে মাস্ক উল্লম্ব কিনারার দুই পাশে পড়ে, তাই g y বড়। p3-তে মাস্ক আনুভূমিক কিনারার দুই পাশে পড়ে, তাই g x বড়। কোণের কাছে p4-এ দুটোই অশূন্য। ঠিক কিনারাতেই মান বড় হয়।"},
 {scene:"im",k:0,en:"On a full image, the Sobel gradient magnitude lights up the edges and leaves flat regions dark. It is widely used for edge enhancement, for example in industrial inspection.",
   bn:"পুরো ইমেজে সোবেল গ্রেডিয়েন্টের মান কিনারাগুলোকে উজ্জ্বল করে আর সমান অঞ্চল অন্ধকার রাখে। কিনারা স্পষ্ট করতে এটি ব্যাপকভাবে ব্যবহৃত হয়, যেমন শিল্প পরিদর্শনে।"}
],
points:[{en:"M(x,y) = √(g_x² + g_y²) ≈ |g_x| + |g_y|.",bn:"M(x,y) = √(g_x² + g_y²) ≈ |g_x| + |g_y|।"},{en:"Roberts: 2 × 2 diagonal differences. Sobel: [−1 −2 −1; 0 0 0; 1 2 1] and [−1 0 1; −2 0 2; −1 0 1].",bn:"রবার্টস: ২ × ২ কোণাকুণি পার্থক্য। সোবেল: [−১ −২ −১; ০ ০ ০; ১ ২ ১] ও [−১ ০ ১; −২ ০ ২; −১ ০ ১]।"}]}
],
quiz:[
 {q:{en:"Convolution differs from correlation because the kernel is…",bn:"কনভোলিউশন কোরিলেশন থেকে আলাদা কারণ কার্নেল…"},o:[{en:"normalised",bn:"নর্মালাইজ করা হয়"},{en:"rotated by 180°",bn:"১৮০° ঘোরানো হয়"},{en:"squared",bn:"বর্গ করা হয়"},{en:"made larger",bn:"বড় করা হয়"}],a:1,w:{en:"Flip both horizontally and vertically.",bn:"আনুভূমিক ও উল্লম্ব দুই দিকে উল্টানো।"}},

(()=>{
function lzw(seq){const D=new Map();for(let i=0;i<256;i++)D.set(String(i),i);let next=256,cur="";const rows=[];
  for(const p of seq){const s=cur?cur+"-"+p:String(p);if(D.has(s)){rows.push([cur,p,"","",""]);cur=s}else{rows.push([cur,p,D.get(cur),next,s]);D.set(s,next++);cur=String(p)}}
  rows.push([cur,"",D.get(cur),"",""]);return rows}

steps:[
 {scene:"ll",k:0,en:"The objective of compression is to reduce the amount of data needed to represent an image, by removing redundant data. Reconstructing the image is decompression. If the reconstruction is identical to the original, the compression is lossless: information preserving, but with low compression ratios. If it is only an approximation, it is lossy, with much higher ratios. There is a trade-off between information loss and compression ratio.",
   bn:"কমপ্রেশনের উদ্দেশ্য হলো অপ্রয়োজনীয় ডেটা সরিয়ে একটি ইমেজ উপস্থাপনের জন্য দরকারি ডেটার পরিমাণ কমানো। ইমেজ আবার তৈরি করাকে বলে ডিকমপ্রেশন। পুনর্গঠিত ইমেজ যদি মূল ইমেজের হুবহু একই হয়, তাহলে কমপ্রেশন লসলেস: তথ্য অক্ষত থাকে, কিন্তু কমপ্রেশন অনুপাত কম। যদি শুধু কাছাকাছি হয়, তাহলে লসি, যার অনুপাত অনেক বেশি। তথ্য হারানো আর কমপ্রেশন অনুপাতের মধ্যে একটি ভারসাম্য আছে।"},
 {scene:"di",k:0,en:"Data and information are not the same. Data are the means by which information is conveyed. These three sentences carry the same information with different amounts of data. Representations that contain irrelevant or repeated information contain redundant data.",
   bn:"ডেটা আর তথ্য এক নয়। ডেটা হলো তথ্য পৌঁছানোর মাধ্যম। এই তিনটি বাক্য একই তথ্য বহন করে, কিন্তু ভিন্ন পরিমাণ ডেটা দিয়ে। অপ্রাসঙ্গিক বা পুনরাবৃত্ত তথ্য থাকলে সেই উপস্থাপনে রিডান্ড্যান্ট ডেটা থাকে।"},
 {scene:"cr",k:0,en:"If n1 and n2 are the numbers of information carrying units in two datasets that represent the same information, the compression ratio is C equals n1 over n2. For 100 and 10, C is 10 to 1. The relative data redundancy is R equals 1 minus 1 over C, here 0.9: ninety percent of the first dataset is redundant.",
   bn:"একই তথ্য উপস্থাপনকারী দুটি ডেটাসেটে তথ্য বহনকারী এককের সংখ্যা যদি n1 ও n2 হয়, তাহলে কমপ্রেশন অনুপাত C সমান n1 ভাগ n2। ১০০ ও ১০ হলে C হয় ১০ : ১। আপেক্ষিক ডেটা রিডান্ড্যান্সি R সমান ১ বিয়োগ ১ ভাগ C, এখানে ০.৯: অর্থাৎ প্রথম ডেটাসেটের নব্বই শতাংশ রিডান্ড্যান্ট।"}

steps:[
 {fx:(s,_)=>_.say(-1,"Coding · interpixel · psycho-visual","Compression is achieved when one or more of these redundancies are reduced or removed.",""),en:"There are three types of redundancy in images: coding redundancy, interpixel redundancy and psycho-visual redundancy. Compression is achieved when one or more of them is reduced or eliminated.",
   bn:"ইমেজে তিন ধরনের রিডান্ড্যান্সি আছে: কোডিং রিডান্ড্যান্সি, ইন্টারপিক্সেল রিডান্ড্যান্সি এবং সাইকো-ভিজুয়াল রিডান্ড্যান্সি। এদের এক বা একাধিক কমালে বা দূর করলে কমপ্রেশন হয়।"},
 {fx:(s,_)=>_.say(0,"Coding redundancy","Natural binary gives every level the same number of bits,","even though some levels are far more probable than others."),en:"Coding redundancy is present when the codes do not take advantage of the probabilities of the intensities. Natural binary code assigns the same number of bits to the most and least probable values. Most histograms are not uniform, so this wastes bits.",
   bn:"কোডিং রিডান্ড্যান্সি থাকে যখন কোডগুলো তীব্রতার সম্ভাবনার সুবিধা নেয় না। ন্যাচারাল বাইনারি কোড সবচেয়ে বেশি ও সবচেয়ে কম সম্ভাব্য মান দুটোকেই সমান বিট দেয়। বেশিরভাগ হিস্টোগ্রাম সুষম নয়, তাই এতে বিট নষ্ট হয়।"},
 {fx:(s,_)=>_.say(1,"Interpixel redundancy","Neighbouring pixels are correlated, so a pixel can be predicted from its neighbours.","Here all 256 intensities are equally likely, yet each row is completely predictable."),en:"Interpixel redundancy comes from correlation between neighbouring pixels: a pixel can be predicted from its neighbours. In this image of random constant lines, the histogram is uniform, so coding cannot help. But pixels along each line are identical, so they are maximally correlated horizontally.",
   bn:"ইন্টারপিক্সেল রিডান্ড্যান্সি আসে পাশাপাশি পিক্সেলের পারস্পরিক সম্পর্ক থেকে: একটি পিক্সেল তার প্রতিবেশী দেখে অনুমান করা যায়। এলোমেলো সমান রেখার এই ইমেজে হিস্টোগ্রাম সুষম, তাই কোডিং কোনো সাহায্য করে না। কিন্তু প্রতিটি রেখার পিক্সেল একই, তাই আনুভূমিকভাবে তারা পুরোপুরি সম্পর্কিত।"},
 {fx:(s,_)=>_.say(2,"Psycho-visual redundancy","Information the eye ignores can be removed.","Store just one average value: 256 × 256 × 8 bits ÷ 8 bits = 65,536 : 1"),en:"Psycho-visual redundancy is information the human visual system ignores. This image looks like a uniform gray field, so it can be represented by its average intensity alone, a single 8-bit value. The compression is 256 times 256 times 8 bits over 8 bits, that is 65,536 to 1, with little or no visible loss.",
   bn:"সাইকো-ভিজুয়াল রিডান্ড্যান্সি হলো এমন তথ্য যা মানুষের চোখ উপেক্ষা করে। এই ইমেজটি একটি সমান ধূসর ক্ষেত্রের মতো দেখায়, তাই শুধু এর গড় তীব্রতা, অর্থাৎ একটি ৮-বিট মান দিয়েই উপস্থাপন করা যায়। কমপ্রেশন হয় ২৫৬ গুণ ২৫৬ গুণ ৮ বিট ভাগ ৮ বিট, অর্থাৎ ৬৫,৫৩৬ : ১, প্রায় কোনো দৃশ্যমান ক্ষতি ছাড়াই।"}
].map(s=>Object.assign({k:0},s)),
points:[{en:"<b>Coding</b>: codes ignore probabilities. <b>Interpixel</b>: neighbours are correlated. <b>Psycho-visual</b>: information the eye ignores.",bn:"<b>কোডিং</b>: কোড সম্ভাবনা উপেক্ষা করে। <b>ইন্টারপিক্সেল</b>: প্রতিবেশীরা সম্পর্কিত। <b>সাইকো-ভিজুয়াল</b>: চোখ যা উপেক্ষা করে।"},{en:"Uniform-looking 256 × 256 image → one 8-bit value: 65,536 : 1.",bn:"সমান দেখানো ২৫৬ × ২৫৬ ইমেজ → একটি ৮-বিট মান: ৬৫,৫৩৬ : ১।"}]},

   en:"A code is a list of symbols, and a code word is a sequence of symbols that represents a gray level. Its length is the number of symbols. In this image only four intensities occur, with probabilities 0.25, 0.47, 0.25 and 0.03. Natural 8-bit binary, code 1, uses 8 bits for each.",
   bn:"কোড হলো প্রতীকের একটি তালিকা, আর কোড ওয়ার্ড হলো একটি গ্রে লেভেল বোঝাতে ব্যবহৃত প্রতীকের ক্রম। এর দৈর্ঘ্য হলো প্রতীকের সংখ্যা। এই ইমেজে মাত্র চারটি তীব্রতা আছে, যাদের সম্ভাবনা ০.২৫, ০.৪৭, ০.২৫ ও ০.০৩। ন্যাচারাল ৮-বিট বাইনারি, অর্থাৎ কোড ১, প্রতিটির জন্য ৮ বিট ব্যবহার করে।"},
 {k:0,fx:(svg,_)=>{_.tb.col(4,1);_.tb.col(5,1);return seq([[300,()=>$$(svg,"#cd-1").textContent="code 2: 0.25(2) + 0.47(1) + 0.25(3) + 0.03(3)"],[1400,()=>$$(svg,"#cd-2").textContent="L_avg = 1.81 bits"],[1200,()=>$$(svg,"#cd-3").textContent="C = 8 / 1.81 ≈ 4.42     R = 1 − 1/4.42 ≈ 0.774"]])},
   en:"Code 2 is a variable-length code: the most common value gets the shortest code word. The average length is 0.25 times 2, plus 0.47 times 1, plus 0.25 times 3, plus 0.03 times 3, which is 1.81 bits. The compression ratio is 8 over 1.81, about 4.42, and the relative redundancy is about 0.774. So 77 percent of the 8-bit data was coding redundancy.",
   bn:"কোড ২ একটি ভেরিয়েবল-লেংথ কোড: সবচেয়ে বেশি আসা মানটি সবচেয়ে ছোট কোড ওয়ার্ড পায়। গড় দৈর্ঘ্য ০.২৫ গুণ ২ যোগ ০.৪৭ গুণ ১ যোগ ০.২৫ গুণ ৩ যোগ ০.০৩ গুণ ৩, অর্থাৎ ১.৮১ বিট। কমপ্রেশন অনুপাত ৮ ভাগ ১.৮১, প্রায় ৪.৪২, আর আপেক্ষিক রিডান্ড্যান্সি প্রায় ০.৭৭৪। অর্থাৎ ৮-বিট ডেটার ৭৭ শতাংশই ছিল কোডিং রিডান্ড্যান্সি।"}
],

{id:"model",slides:"19–24",title:{en:"The image compression model",bn:"ইমেজ কমপ্রেশন মডেল"},

init(svg,_){const g=$$(svg,"#md-g");const B=[[60,70,"Mapper","reduces spatial redundancy","boxb"],[260,70,"Quantizer","irreversible, removes irrelevant data","boxa"],[460,70,"Symbol coder","fixed or variable-length code","boxb"],[460,290,"Symbol decoder","","boxb"],[260,290,"Inverse mapper","","boxb"]];
  _.B=B.map(([x,y,t,s,c])=>{const q=el(g,"g");el(q,"rect",{x,y,width:170,height:90,rx:10,class:c});txt(q,x+85,y+40,t,"c sm");txt(q,x+85,y+64,s,"c xs dim");return q});
  txt(g,20,118,"f(x,y)","sm");arrow(g,30,130,58,130);arrow(g,232,115,258,115);arrow(g,432,115,458,115);el(g,"path",{d:"M632 115 H720 V335 H632",class:"link","marker-end":"url(#ahw)"});txt(g,728,230,"channel","sm dim");
  arrow(g,458,335,432,335);arrow(g,258,335,200,335);txt(g,140,340,"f̂(x,y)","sm");

steps:[
 {k:0,fx:(svg,_)=>{_.B.forEach(b=>b.style.opacity=1);const p=$$(svg,"#md-p");$$(svg,"#md-t").textContent="";return rafLoop(t=>{const u=(t*.45)%(_.path.length-1),i=Math.floor(u),f=u-i;p.setAttribute("cx",_.path[i][0]+(_.path[i+1][0]-_.path[i][0])*f);p.setAttribute("cy",_.path[i][1]+(_.path[i+1][1]-_.path[i][1])*f)})},
   en:"A general compression system has an encoder and a decoder. The encoder removes redundancy in three independent stages. First, the mapper transforms the image into a format, usually not visual, that reduces spatial redundancy. It is generally reversible. Run-length coding is an example.",
   bn:"একটি সাধারণ কমপ্রেশন সিস্টেমে একটি এনকোডার ও একটি ডিকোডার থাকে। এনকোডার তিনটি স্বাধীন ধাপে রিডান্ড্যান্সি দূর করে। প্রথমে ম্যাপার ইমেজকে এমন একটি রূপে নেয়, সাধারণত যা দেখার মতো নয়, যাতে স্পেশাল রিডান্ড্যান্সি কমে। এটি সাধারণত রিভার্সিবল। রান-লেংথ কোডিং এর একটি উদাহরণ।"},
 {k:0,fx:(svg,_)=>{_.B.forEach((b,i)=>b.style.opacity=i===1?1:.3);$$(svg,"#md-t").textContent="quantizer: irreversible · omitted for error-free compression"},
   en:"Second, the quantizer reduces the accuracy of the mapper output according to a fidelity criterion, keeping irrelevant information out. This step is irreversible, so it must be omitted when error-free, lossless compression is wanted.",
   bn:"দ্বিতীয়ত, কোয়ান্টাইজার একটি ফিডেলিটি মানদণ্ড অনুযায়ী ম্যাপারের আউটপুটের নির্ভুলতা কমায়, যাতে অপ্রাসঙ্গিক তথ্য বাদ পড়ে। এই ধাপটি অপরিবর্তনীয়, তাই নির্ভুল, লসলেস কমপ্রেশন চাইলে এটি বাদ দিতে হয়।"},
 {k:0,fx:(svg,_)=>{_.B.forEach((b,i)=>b.style.opacity=i===2?1:.3);$$(svg,"#md-t").textContent="shortest code words for the most frequent values"},
   en:"Third, the symbol coder generates a fixed or variable-length code for the quantizer output. With a variable-length code, the shortest code words go to the most frequent values, which minimises coding redundancy. This step is reversible.",
   bn:"তৃতীয়ত, সিম্বল কোডার কোয়ান্টাইজারের আউটপুটের জন্য নির্দিষ্ট বা পরিবর্তনশীল দৈর্ঘ্যের কোড তৈরি করে। পরিবর্তনশীল দৈর্ঘ্যের কোডে সবচেয়ে বেশি আসা মান সবচেয়ে ছোট কোড ওয়ার্ড পায়, এতে কোডিং রিডান্ড্যান্সি সবচেয়ে কম হয়। এই ধাপটি রিভার্সিবল।"},
 {k:0,fx:(svg,_)=>{_.B.forEach((b,i)=>b.style.opacity=i>=3?1:.3);$$(svg,"#md-t").textContent="lossless: mapper → symbol encoder   ·   lossy: mapper → quantizer → symbol encoder"},
   en:"The decoder has only two parts, a symbol decoder and an inverse mapper, which undo the coder and mapper in reverse order. There is no inverse quantizer, because quantization loses information permanently. So a lossless encoder is mapper plus symbol encoder, and a lossy encoder adds the quantizer.",
   bn:"ডিকোডারে মাত্র দুটি অংশ থাকে, একটি সিম্বল ডিকোডার ও একটি ইনভার্স ম্যাপার, যারা উল্টো ক্রমে কোডার ও ম্যাপারের কাজ ফিরিয়ে আনে। কোনো ইনভার্স কোয়ান্টাইজার নেই, কারণ কোয়ান্টাইজেশনে তথ্য চিরতরে হারিয়ে যায়। তাই লসলেস এনকোডার হলো ম্যাপার যোগ সিম্বল এনকোডার, আর লসি এনকোডারে কোয়ান্টাইজার যোগ হয়।"}
],
points:[{en:"Encoder: <b>mapper</b> (reversible) → <b>quantizer</b> (irreversible) → <b>symbol coder</b> (reversible).",bn:"এনকোডার: <b>ম্যাপার</b> (রিভার্সিবল) → <b>কোয়ান্টাইজার</b> (অপরিবর্তনীয়) → <b>সিম্বল কোডার</b> (রিভার্সিবল)।"},{en:"Decoder: symbol decoder → inverse mapper; no inverse quantizer. Lossless omits the quantizer.",bn:"ডিকোডার: সিম্বল ডিকোডার → ইনভার্স ম্যাপার; ইনভার্স কোয়ান্টাইজার নেই। লসলেসে কোয়ান্টাইজার নেই।"}]},

init(svg,_){const g=$$(svg,"#hf-g");const N={a2:[60,360,.4],a6:[140,360,.3],a1:[220,360,.1],a4:[300,360,.1],a3:[370,360,.06],a5:[440,360,.04],n1:[405,290,.1],n2:[352,225,.2],n3:[286,160,.3],n4:[213,100,.6],root:[136,44,1]};
  const E=[["n1","a3","0"],["n1","a5","1"],["n2","a4","0"],["n2","n1","1"],["n3","n2","0"],["n3","a1","1"],["n4","a6","0"],["n4","n3","1"],["root","n4","0"],["root","a2","1"]];
  _.E=E.map(([p,c,b])=>{const q=el(g,"g",{style:"opacity:0;transition:opacity .5s"});el(q,"line",{x1:N[p][0],y1:N[p][1],x2:N[c][0],y2:N[c][1],class:"link"});const l=txt(q,(N[p][0]+N[c][0])/2-12,(N[p][1]+N[c][1])/2,b,"am mono sm");l.style.opacity=0;return{q,l,p}});
  _.N={};for(const k in N){const[x,y,p]=N[k];const q=el(g,"g",{style:k[0]==="a"?"":"opacity:0;transition:opacity .5s"});el(q,"circle",{cx:x,cy:y,r:k[0]==="a"?24:20,class:k[0]==="a"?"boxb":"boxa"});txt(q,x,y+(k[0]==="a"?-1:5),k[0]==="a"?k:p.toFixed(1),"c xs mono");if(k[0]==="a")txt(q,x,y+13,String(p),"c xs mono dim");_.N[k]=q}
  _.order=["n1","n2","n3","n4","root"];
  _.tb=table($$(svg,"#hf-t"),{x:520,y:60,cw:[60,70,90,50],rh:38,fs:13,head:["symbol","p","code","l"],rows:[["a2",.4,"1",1],["a6",.3,"00",2],["a1",.1,"011",3],["a4",.1,"0100",4],["a3",.06,"01010",5],["a5",.04,"01011",5]]});_.tb.col(2,0);_.tb.col(3,0);

steps:[
 {k:0,fx:(svg,_)=>{_.reset();_.tb.col(2,0);_.tb.col(3,0);$$(svg,"#hf-l").textContent="";const L=_.order.map(k=>[1100,()=>{_.N[k].style.opacity=1;_.E.filter(e=>e.p===k).forEach(e=>e.q.style.opacity=1)}]);L.reset=_.reset;return seq(L,true,2500)},
   en:"Huffman coding removes coding redundancy and produces a variable-length code close to the theoretical minimum. Order the probabilities, combine the two smallest, and repeat until two remain. Here 0.06 and 0.04 make 0.1. Then 0.1 and 0.1 make 0.2. Then 0.2 and 0.1 make 0.3. Then 0.3 and 0.3 make 0.6. Finally 0.6 and 0.4 make 1.",
   bn:"হাফম্যান কোডিং কোডিং রিডান্ড্যান্সি দূর করে এবং তাত্ত্বিক সর্বনিম্নের কাছাকাছি একটি পরিবর্তনশীল দৈর্ঘ্যের কোড তৈরি করে। সম্ভাবনাগুলো সাজাও, সবচেয়ে ছোট দুটি যোগ করো, এবং দুটি না থাকা পর্যন্ত চালিয়ে যাও। এখানে ০.০৬ ও ০.০৪ মিলে ০.১। তারপর ০.১ ও ০.১ মিলে ০.২। তারপর ০.২ ও ০.১ মিলে ০.৩। তারপর ০.৩ ও ০.৩ মিলে ০.৬। শেষে ০.৬ ও ০.৪ মিলে ১।"},
 {k:0,fx:(svg,_)=>{_.order.forEach(k=>_.N[k].style.opacity=1);_.E.forEach(e=>{e.q.style.opacity=1;e.l.style.opacity=0});const L=[..._.E].reverse().map(e=>[350,()=>e.l.style.opacity=1]);L.push([600,()=>{_.tb.col(2,1);_.tb.col(3,1)}]);return seq(L)},
   en:"Now work backward from the top, assigning 0 and 1 at each split. Reading the bits from the root down to each symbol gives its code: a2 is 1, a6 is 00, a1 is 011, a4 is 0100, a3 is 01010, and a5 is 01011.",
   bn:"এবার উপর থেকে উল্টো দিকে কাজ করো, প্রতিটি ভাগে ০ ও ১ বসাও। রুট থেকে প্রতিটি প্রতীক পর্যন্ত বিটগুলো পড়লে তার কোড পাওয়া যায়: a2 হলো ১, a6 হলো ০০, a1 হলো ০১১, a4 হলো ০১০০, a3 হলো ০১০১০, আর a5 হলো ০১০১১।"},
 {k:0,fx:(svg,_)=>{_.order.forEach(k=>_.N[k].style.opacity=1);_.E.forEach(e=>{e.q.style.opacity=1;e.l.style.opacity=1});_.tb.col(2,1);_.tb.col(3,1);$$(svg,"#hf-l").textContent="L_avg = 0.4(1)+0.3(2)+0.1(3)+0.1(4)+0.06(5)+0.04(5) = 2.2 bits"},
   en:"The average length is 2.2 bits per symbol, compared with 3 bits for a fixed-length code for six symbols. Huffman coding is widely used as the symbol coder in many compression methods, but it does not take advantage of interpixel redundancy.",
   bn:"গড় দৈর্ঘ্য প্রতি প্রতীকে ২.২ বিট, যেখানে ছয়টি প্রতীকের জন্য নির্দিষ্ট দৈর্ঘ্যের কোডে লাগত ৩ বিট। হাফম্যান কোডিং অনেক কমপ্রেশন পদ্ধতিতে সিম্বল কোডার হিসেবে ব্যাপকভাবে ব্যবহৃত হয়, তবে এটি ইন্টারপিক্সেল রিডান্ড্যান্সির সুবিধা নেয় না।"}

init(svg,_){const P=[.2,.2,.4,.2],nm=["a1","a2","a3","a4"],msg=[0,1,2,2,3];const g=$$(svg,"#ac-g");let lo=0,hi=1;_.rows=[];
  for(let s=0;s<=5;s++){const y=70+s*60,q=el(g,"g",{style:"opacity:0;transition:opacity .5s"});el(q,"line",{x1:120,x2:700,y1:y,y2:y,class:"axis",style:"stroke-width:2"});
    let a=lo;const W=hi-lo;const segs=[];P.forEach((p,i)=>{const b=a+p*W,x1=120+(a-lo)/W*580,x2=120+(b-lo)/W*580;const r=el(q,"rect",{x:x1,y:y-12,width:x2-x1,height:24,class:"cell"});if(s<5)txt(q,(x1+x2)/2,y+5,nm[i],"c xs mono");segs.push(r);a=b});
    txt(q,112,y+5,+lo.toFixed(5)+"","e xs mono");txt(q,708,y+5,+hi.toFixed(5)+"","xs mono");_.rows.push({q,segs,lo,hi});
    if(s<5){const i=msg[s];const nlo=lo+P.slice(0,i).reduce((x,y)=>x+y,0)*W;hi=nlo+P[i]*W;lo=nlo}}
  _.final=[lo,hi]},
steps:[
 {k:0,fx:(svg,_)=>{_.rows.forEach((r,i)=>r.q.style.opacity=i===0?1:0);$$(svg,"#ac-t").textContent="a1 [0, 0.2)   a2 [0.2, 0.4)   a3 [0.4, 0.8)   a4 [0.8, 1)"},
   en:"Huffman coding encodes symbols one at a time. Arithmetic coding encodes a whole sequence of symbols as a single code word, a fraction between 0 and 1. There is no one-to-one correspondence between symbols and code words. Each symbol gets an interval sized by its probability: a1 from 0 to 0.2, a2 from 0.2 to 0.4, a3 from 0.4 to 0.8, and a4 from 0.8 to 1.",
   bn:"হাফম্যান কোডিং একবারে একটি করে প্রতীক এনকোড করে। অ্যারিথমেটিক কোডিং পুরো প্রতীকের ক্রমকে একটি মাত্র কোড ওয়ার্ড হিসেবে এনকোড করে, যা ০ থেকে ১-এর মধ্যে একটি ভগ্নাংশ। প্রতীক আর কোড ওয়ার্ডের মধ্যে এক-এক সম্পর্ক থাকে না। প্রতিটি প্রতীক তার সম্ভাবনা অনুযায়ী একটি ব্যবধি পায়: a1 ০ থেকে ০.২, a2 ০.২ থেকে ০.৪, a3 ০.৪ থেকে ০.৮, আর a4 ০.৮ থেকে ১।"},

const AND=(A,B)=>A.map((r,i)=>r.map((v,j)=>v&&B[i][j]?1:0)),NOT=A=>A.map(r=>r.map(v=>v?0:1)),MINUS=(A,B)=>A.map((r,i)=>r.map((v,j)=>v&&!B[i][j]?1:0)),OR=(A,B)=>A.map((r,i)=>r.map((v,j)=>v||B[i][j]?1:0));
const same=(A,B)=>A.every((r,i)=>r.every((v,j)=>v===B[i][j]));
const seImg=n=>new Array(n*n).fill(1);
function hitTemplate(A,T){const R=A.length,C=A[0].length,g=(r,c)=>A[Math.min(R-1,Math.max(0,r))][Math.min(C-1,Math.max(0,c))];
  return A.map((row,r)=>row.map((_,c)=>{for(let i=0;i<3;i++)for(let j=0;j<3;j++){const t=T[i][j];if(t==="X")continue;if(+t!==g(r+i-1,c+j-1))return 0}return 1}))}
